// ---------- one session ----------

// Local paths (~/... or /Users/...) and bare localhost addresses become links.
const PATH_RE = /(^|[\s(\[:'"])((?:~|\/Users\/[^\/\s]+)(?:\/(?:[^\s`'"<>()|,;&]|&amp;|&#39;)+)+)/g;
function fileLink(pth) {
  const clean = pth.replace(/[.:]+$/, '');
  return `<a class="flink" data-path="${clean}" title="Open ${clean}">${clean}</a>` + pth.slice(clean.length);
}
function linkify(t) {
  return t
    .replace(/(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])((?:localhost|127\.0\.0\.1):\d{2,5}(?:\/[^\s<)]*[^\s<).,;:])?)/g, '$1<a href="http://$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(PATH_RE, (m, pre, pth) => pre + fileLink(pth));
}
function inline(s) {
  return linkify(s)
    .replace(/`([^`\n]+)`/g, (m, c) => (/^(?:~|\/Users\/)[^\s]*$/.test(c) && !c.includes('<') ? '<code>' + fileLink(c) + '</code>' : /^(?:localhost|127\.0\.0\.1):\d/.test(c) && !c.includes('<') ? `<code><a href="http://${c}" target="_blank" rel="noopener noreferrer">${c}</a></code>` : '<code>' + c + '</code>'))
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/^#{1,4} (.+)$/gm, '<b class="h">$1</b>');
}
// Markdown tables become real tables. Works on already-escaped text.
function tables(text) {
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const cells = (l) => l.trim().slice(1, -1).split('|').map((c) => c.trim());
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    if (isRow(lines[i]) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const head = cells(lines[i]);
      const body = [];
      i += 2;
      while (i < lines.length && isRow(lines[i])) body.push(cells(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>' + head.map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + body.map((r) => '<tr>' + r.map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
    } else out.push(lines[i++]);
  }
  return out.join('\n').replace(/\n?(<div class="tbl">.*?<\/div>)\n?/g, '$1');
}
const md = (t) => t.split('```').map((p, i) => (i % 2 ? `<pre>${esc(p.replace(/^[\w+-]*\n/, ''))}</pre>` : inline(tables(esc(p))))).join('');
// Pasted blocks show up as raw tags in prompts; hide the tags in one-line previews.
const plain = (t) => String(t || '').replace(/<\/?pasted_content[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

function threadHtml() {
  const t = S.thread;
  if (!t) return '<div class="note-line">Loading the conversation.</div>';
  if (t.error) return '<div class="note-line">Could not read this conversation.</div>';
  if (!t.msgs.length) return '<div class="note-line">Nothing has been said in this one yet. Say something below.</div>';
  let h = t.shown < t.total ? `<div class="thread-head"><span>Showing the latest ${t.shown} of ${t.total}</span><button class="linkbtn" data-act="all">Show all</button><span class="line"></span></div>` : '';
  for (const m of t.msgs) {
    if (m.r === 'u') h += `<span class="when-u">${esc(when(m.ts))}</span><div class="msg u">${userBody(m.t)}</div>`;
    else if (m.r === 'a') h += `<div class="msg a">${md(m.t)}</div>`;
    else if (m.r === 'n') h += `<div class="msg n">${esc(m.t)}</div>`;
    else h += `<details class="msg t"><summary>${icon('chevron')}${m.tools.length === 1 ? '1 step' : m.tools.length + ' steps'}: ${esc([...new Set(m.tools.map((x) => x.n))].slice(0, 4).join(', '))}</summary><div class="acts">${m.tools.map((x) => `<div><b>${esc(x.n)}</b> ${esc(x.d)}</div>`).join('')}</div></details>`;
  }
  return h;
}

// Messages sent from here list attached files at the end; show those as thumbnails.
function userBody(t) {
  const i = t.indexOf('Attached files (read them):\n');
  if (i < 0) return esc(t);
  const text = t.slice(0, i).trim();
  const paths = t.slice(i).split('\n').slice(1).filter(Boolean);
  const thumbs = paths.map((pth) => {
    const name = pth.split('/').pop();
    if (/^[0-9a-f-]{36}\.(png|jpg|gif|webp)$/.test(name)) return `<img src="/api/upload/${name}" alt="Attached image" data-zoom>`;
    return `<span class="fchip">${esc(name)}</span>`;
  }).join('');
  return esc(text) + `<div class="thumbs">${thumbs}</div>`;
}

const cur = () => S.byId.get(S.sel);
const nearBottom = () => { const m = $('#main'); return m.scrollHeight - m.scrollTop - m.clientHeight < 260; };
const toBottom = () => { const m = $('#main'); m.scrollTop = m.scrollHeight; };
const norm = (t) => String(t || '').replace(/\s+/g, ' ').trim();
const autosize = (ta) => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 220) + 'px'; };
const typingInView = () => { const a = document.activeElement; return !!a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#view').contains(a); };

function olderModel(s) {
  const m = /^claude-([a-z]+)-(\d+)-(\d+)$/.exec(s.model || '');
  const latest = m && (S.latest || {})[m[1]];
  return latest && latest !== s.model ? latest : '';
}
function badgeHtml(s) {
  const old = olderModel(s);
  const oldTag = !s.model ? '' : old ? `<span class="badge warning" title="This chat runs ${esc(modelName(s.model))}. ${esc(modelName(old))} is newer. Pick it by Send to switch.">${esc(modelName(s.model))}</span>` : `<span class="badge" title="Model this chat is using now (read from its last reply)">${esc(modelName(s.model) || s.model)}</span>`;
  return oldTag + (s.ctx && s.src === 'claude' ? `<button class="meterbtn" data-act="handoff" data-sid="${s.id}" title="Context used. Click to hand off to a fresh chat.">${meter(s)}</button>` : meter(s)) + (s.live ? statusBadge(s) : '<span class="badge">Closed</span>') + `<span class="hide-sm" style="display:contents">${chip(s.tag)}</span>`;
}
function primaryHtml(s) {
  if (s.live && !s.live.bg) return `<button class="btn outline sm" data-act="focus" data-pid="${s.live.pid}" title="It is already open in Terminal (${esc(s.live.tty || 'tab')}). This jumps to that tab.">${icon('go')}Go to tab</button>`;
  return `<button class="btn outline sm" data-act="openterm" data-sid="${s.id}">${icon('terminal')}Open in Terminal</button>`;
}
function hintText(s) {
  const keys = ' Enter to send, Shift+Enter for a new line.' + voiceHint();
  if (s.live && s.live.bg) return (s.live.status === 'busy' ? 'Working in the background (started from the Hub). Your message waits until this reply finishes, then continues the same chat.' : 'Running in the background.') + keys;
  if (s.live) {
    if (s.live.status === 'busy') return 'This tab is working. Your message waits here and goes in when it is free.' + keys;
    if (s.live.status !== 'idle') return 'This tab is in shell mode, so sending is off. Use Go to tab.';
    return `Typed straight into the open tab (${esc(s.live.tty || 'no tty')}), as if you were sitting in it. Picking a model types /model there first.` + keys;
  }
  if (s.src === 'codex') return 'This session is closed. Codex replies here in the background.' + keys;
  return `This session is closed. Claude replies here in the background, in ${esc(s.permMode && s.permMode !== 'default' ? s.permMode : 'auto')} mode.` + keys;
}

function tailHtml(s) {
  const st = S.st || {};
  const dots = '<span class="dots"><i></i><i></i><i></i></span>';
  let h = '';
  if (S.pending && S.pending.id === s.id) {
    h += `<div class="msg u pending">${userBody(S.pending.text)}</div>`;
    const quiet = !st.running && !st.queued && !(s.live && s.live.status === 'busy');
    if (quiet && Date.now() - S.pending.at > 20000) h += `<div class="alert">${icon('alert')}<div class="body"><b>This has not shown up in the chat yet.</b><div class="muted">It may be sitting unsent in the tab's input box. Go to the tab and press Enter, or clear the box there.</div><div class="acts">${s.live ? `<button class="btn primary sm" data-act="focus" data-pid="${s.live.pid}">Go to tab</button>` : ''}<button class="btn ghost sm" data-act="droppending">Dismiss</button></div></div></div>`;
  }
  const doing = st.lastTool && (st.running || (s.live && s.live.status === 'busy')) ? `<span class="now">${esc(st.lastTool.n)}${st.lastTool.d ? ': ' + esc(st.lastTool.d) : ''}</span>` : '';
  if (needsApproval(s)) {
    const pt = pendingOf(s) || {};
    const msg = (s.live.ev && s.live.ev.message) || (pt.n ? 'It wants to run ' + pt.n + (pt.d ? ': ' + pt.d : '') + '.' : '');
    h += `<div class="alert">${icon('alert')}<div class="body"><b>Waiting for your approval in its tab.</b><div class="muted">${esc(msg)} Approve or deny it there.</div><div class="acts"><button class="btn primary sm" data-act="focus" data-pid="${s.live.pid}">Go to tab</button></div></div></div>`;
  }
  else if (st.queued) h += `<div class="status-line">${dots}Waiting for ${s.live && s.live.bg ? 'the current reply' : 'this tab'} to finish, then your message goes in.<button class="linkbtn" data-act="cancel">Cancel</button></div>`;
  else if (st.running) h += `<div class="status-line">${dots}${doing || toolName(s.src) + ' is replying in the background.'}</div>`;
  else if (s.live && s.live.status === 'busy') h += `<div class="status-line">${dots}${doing || 'Working in its tab.'}</div>`;
  if (st.denials && st.denials.length && st.deniedAt > S.errSeen) {
    h += `<div class="alert">${icon('alert')}<div class="body"><b>It stopped short of ${st.denials.length === 1 ? 'one step' : st.denials.length + ' steps'} that need your approval.</b>${st.denials.map((d) => `<div class="muted">${esc(d.n)}${d.d ? ': ' + esc(d.d) : ''}</div>`).join('')}<div class="acts"><button class="btn outline sm" data-act="retryedits">Retry with edits allowed</button><button class="btn outline sm" data-act="resume">Open in Terminal to approve</button></div></div></div>`;
  }
  if (st.error && st.errorAt > S.errSeen) h += `<div class="status-line err">${esc(st.error)}</div>`;
  return h;
}

function catchupHtml(s) {

}

const MODEL_IDS = () => ['fable', 'opus', 'sonnet', 'haiku'].map((f) => (S.latest || {})[f] || f);
const modelName = (m) => { const x = String(m || '').match(/claude-([a-z]+)-(\d+)-(\d+)/); return x ? x[1][0].toUpperCase() + x[1].slice(1) + ' ' + x[2] + '.' + x[3] : ''; };
// One list, the model in use is the one shown selected. Picking another switches the
// chat to it on the next Send; picking the current one changes nothing.
function modelSelect(s, id) {
  if (s && s.src === 'codex') return '';
  const now = s ? s.model || '' : S.defaultModel || '';
  const pick = (s ? S.models[s.id] : '') || now;
  const ids = MODEL_IDS();
  if (now && !ids.includes(now)) ids.unshift(now);
  const label = (v) => (modelName(v) || v[0].toUpperCase() + v.slice(1)) + (v === now ? (s ? ' (current)' : ' (default)') : '');
  const opts = (now ? '' : `<option value=""${pick ? '' : ' selected'}>${s ? 'Model: unknown' : 'Model: default'}</option>`) + ids.map((v) => `<option value="${esc(v)}"${v === pick ? ' selected' : ''}>${esc(label(v))}</option>`).join('');
  return `<select class="modelpick" id="${id || 'mpick'}" title="${s ? 'Model this chat uses. Pick another to switch on your next message.' : 'Model for the new chat'}">${opts}</select>`;
}

const EFFORT_OPTS = [['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['xhigh', 'Extra high'], ['max', 'Max']];
// An open tab keeps the effort it last ran at. A closed chat replies at your default
// (effortLevel in settings), so that is what it shows as current.
const currentEffort = (s) => (s && s.live && !s.live.bg && s.effort) || S.defaultEffort || '';
function effortSelect(s, id) {
  if (s && s.src === 'codex') return '';
  const now = currentEffort(s);
  const pick = (s ? S.efforts[s.id] : '') || now;
  const tag = s ? ' (current)' : ' (default)';
  const opts = EFFORT_OPTS.slice();
  if (now && !opts.some(([v]) => v === now)) opts.unshift([now, now[0].toUpperCase() + now.slice(1)]);
  const html = (now ? '' : `<option value=""${pick ? '' : ' selected'}>Effort: default${tag}</option>`)
    + opts.map(([v, l]) => `<option value="${v}"${v === pick ? ' selected' : ''}>Effort: ${l}${v === now ? tag : ''}</option>`).join('');
  return `<select class="modelpick" id="${id || 'epick'}" title="${s ? 'How hard Claude thinks. Pick another to change it from your next message.' : 'How hard Claude thinks in the new chat'}">${html}</select>`;
}

];
function paletteItems(q) {

  add('Popular', 'Deep research', 'Researches across many sources and writes a report', 'prefix', 'Use the deep-research skill to research: ');
  add('Popular', 'Plan first', 'Shows a plan before changing anything', 'plan', '');
  add('Popular', 'Think hard', 'Max effort for this message', 'effort', 'max');

  add('Popular', 'Security review', 'Security review of the pending changes', 'text', '/security-review');
  add('Popular', 'Simplify', 'Cleans up the changed code', 'text', '/simplify');
  for (const [c, d] of BUILTINS) add('Claude Code commands', c, d, 'text', c + ' ', true);

let palIndex = 0;

function closePalette() { const b = $('#palette'); if (b) b.hidden = true; S.palOpen = false; S.palQuery = ''; }
function pickPalette(i) {

  if (x.kind === 'plan') { const key = s ? s.id : 'new'; S.plan[key] = !S.plan[key]; if ($('#quick') && s) $('#quick').innerHTML = quickHtml(s); toast(S.plan[key] ? 'Plan first is on for your next message.' : 'Plan first is off.'); ta.value = rest; return ta.focus(); }
  if (x.kind === 'effort') { const sel = $('#epick') || $('#nepick'); if (sel) { sel.value = x.value; if (s) S.efforts[s.id] = x.value; } toast('Max effort for your next message.'); ta.value = rest; return ta.focus(); }
  ta.value = x.value + rest;
  if (s) S.drafts[s.id] = ta.value;
  autosize(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

const NUDGES = [['Go', 'go'], ['Continue', 'continue'], ['What changed?', 'what changed? list it plainly'], ['Summarize', 'summarize where we are in 3 lines']];

function quickHtml(s) {
  const st = S.st || {};
  const b = [];
  const busy = st.running || st.queued || (s.live && s.live.status === 'busy');
  if (busy) b.push(`<button class="btn stop sm" data-act="stop">${icon('square')}Stop</button>`);
  const canSend = !busy && !(s.live && !s.live.bg && s.live.status !== 'idle');
  if (S.plan[s.id]) b.push('<button class="nudge on" data-act="planoff" title="Click to turn off">Plan first ✓</button>');
  if (canSend && !s.stub) b.push(...NUDGES.map(([label, text]) => `<button class="nudge" data-act="nudge" data-text="${esc(text)}">${label}</button>`));
  if (s.live && !s.live.bg && s.live.status === 'idle') b.push('<button class="nudge" data-act="quick" data-text="/compact" title="Squeeze this chat to free up context">/compact</button>');
  return b.length ? `<div class="quickrow chiprow">${b.join('')}</div>` : '';
}

function attsHtml(id) {
  return (S.att[id] || []).map((a, i) => `<span class="att${a.file ? '' : ' loading'}" title="${esc(a.name)}">${a.preview ? `<img src="${a.preview}" alt="">` : `<span class="ficon">${icon('file')}</span>`}<span class="truncate">${esc(a.name)}</span><button class="x" data-act="unattach" data-i="${i}" title="Remove">${icon('x')}</button></span>`).join('');
}

async function addFiles(list) {
  const s = cur();
  if (!s || !list || !list.length) return;
  const arr = (S.att[s.id] = S.att[s.id] || []);
  for (const f of [...list].slice(0, 10)) {
    const a = { name: f.name || 'pasted-image.png', file: null, preview: f.type.startsWith('image/') ? URL.createObjectURL(f) : '' };
    if (!/\.[a-z0-9]{1,5}$/i.test(a.name) && f.type.startsWith('image/')) a.name += '.' + f.type.split('/')[1].replace('jpeg', 'jpg');
    arr.push(a);
    if ($('#atts')) $('#atts').innerHTML = attsHtml(s.id);
    try {
      const r = await fetch('/api/upload?name=' + encodeURIComponent(a.name), { method: 'POST', headers: { 'x-sessions': '1', 'content-type': 'application/octet-stream' }, body: f }).then((x) => x.json());
      if (!r.ok) throw new Error(r.error);
      a.file = r.file;
    } catch (e) {
      arr.splice(arr.indexOf(a), 1);
      toast((e && e.message) || 'Upload failed.');
    }
    if (S.sel === s.id && $('#atts')) $('#atts').innerHTML = attsHtml(s.id);
  }
}

function renderLiveBits() {
  const s = cur();
  if (!s) return;
  if ($('#quick')) $('#quick').innerHTML = quickHtml(s);
  if ($('#sbadge')) $('#sbadge').innerHTML = badgeHtml(s);
  if ($('#sprimary')) $('#sprimary').innerHTML = primaryHtml(s);
  if ($('#chint')) $('#chint').innerHTML = hintText(s);
  if ($('#tail')) $('#tail').innerHTML = tailHtml(s);
}

async function loadThread(s) {
  S.threadFor = s.id;
  S.thread = null;
  S.threadAll = false;
  S.threadSize = 0;
  S.st = {};
  S.pending = null;
  await fetchThread(s, true);
  pollState();
}

async function fetchThread(s, stick) {
  let data;
  if (s.stub) data = { msgs: [], total: 0, shown: 0, size: 0 };
  else {
    try { data = await api(`/api/transcript?id=${s.id}&src=${s.src}${S.threadAll ? '&all=1' : ''}`); if (!data.msgs) data = { error: true }; }
    catch (e) { data = { error: true }; }
  }
  if (S.sel !== s.id || S.threadFor !== s.id) return;
  const follow = stick || nearBottom();
  if (S.pending && S.pending.id === s.id && data.msgs) {
    const lastU = [...data.msgs].reverse().find((m) => m.r === 'u');
    if (lastU && lastU.ts > S.pending.at - 5000 && norm(lastU.t).includes(norm(S.pending.match || S.pending.text).slice(0, 30))) S.pending = null;
  }
  S.thread = data;
  if (data.size) S.threadSize = data.size;
  if (data.ctx && s.src === 'codex') { s.ctx = data.ctx; s.ctxLimit = data.ctxLimit; if ($('#sbadge')) $('#sbadge').innerHTML = badgeHtml(s); }
  if ($('#thread')) $('#thread').innerHTML = threadHtml();
  if ($('#tail')) $('#tail').innerHTML = tailHtml(s);
  S.files = data.files || [];
  if (S.panel === 'info') renderPanel();
  if (follow) toBottom();
  if (!document.hidden && unread({ ...s, seen: 0 })) markSeen(s);
}

// While a session is on screen, watch its transcript and any reply in progress.
let stateBusy = false;
async function pollState() {
  if (S.page !== 'session' || document.hidden || stateBusy) return;
  const s = cur();
  if (!s) return;
  stateBusy = true;
  try {
    const st = await api(`/api/state?id=${s.id}&src=${s.src}`);
    if (S.sel !== s.id) return;
    const was = S.st || {};
    S.st = st;
    if (st.ctx != null && st.ctx !== s.ctx) { s.ctx = st.ctx; s.ctxLimit = st.ctxLimit; if ($('#sbadge')) $('#sbadge').innerHTML = badgeHtml(s); }
    if (s.stub && st.exists) { await loadAll(); return; }
    if (st.size && st.size !== S.threadSize) await fetchThread(s, false);
    else if ($('#tail')) $('#tail').innerHTML = tailHtml(s);
    if ($('#quick')) $('#quick').innerHTML = quickHtml(s);
    if (was.running && !st.running) { S.pending = null; await loadAll(); }
    if ($('#catchup')) $('#catchup').innerHTML = catchupHtml(s);
    if (!s.live || s.live.status !== 'busy') maybeAutoHandoff(s);
  } catch (e) {} finally { stateBusy = false; }
}

// Pops the handoff once per chat, the first time it is open at 80% or more.
function maybeAutoHandoff(s) {
  if (s.src !== 'claude' || ctxPct(s) < 80 || document.querySelector('.modal-bg')) return;
  let seen = false;
  try { seen = localStorage.getItem('sd-ho-' + s.id) === '1'; } catch (e) {}
  if (!seen && S.page === 'session' && S.sel === s.id) openHandoff(s, true);
}

async function sendMsg(override) {
  const s = cur();
  const ta = $('#ctext');
  if (!s || !ta || ta.disabled) return;
  if (S.sending[s.id]) return;
  const atts = override ? override.files.map((f) => ({ file: f })) : S.att[s.id] || [];
  if (atts.some((a) => !a.file)) return toast('Still uploading. One moment.');
  const files = atts.map((a) => a.file);
  const text = override ? override.text : ta.value.trim();
  if (!text && !files.length) return;
  if (!override) S.att[s.id] = [];
  if ($('#atts')) $('#atts').innerHTML = attsHtml(s.id);
  if (!override) ta.value = '';
  S.drafts[s.id] = '';
  autosize(ta);
  S.errSeen = Date.now();
  const shown = files.length ? (text ? text + '\n\n' : '') + 'Attached files (read them):\n' + files.join('\n') : text;
  S.pending = { id: s.id, text: shown, match: text || 'Attached files', at: Date.now() };
  S.sending[s.id] = true;
  $('#tail').innerHTML = tailHtml(s);
  toBottom();
  const allowEdits = override ? true : !!S.allowEdits[s.id];
  const model = S.models[s.id] && S.models[s.id] !== s.model ? S.models[s.id] : '';
  const effort = S.efforts[s.id] && S.efforts[s.id] !== currentEffort(s) ? S.efforts[s.id] : '';
  const plan = !!S.plan[s.id];
  const sendText = plan && s.live ? 'Plan first: show me the plan and wait for my OK before changing anything.\n\n' + text : text;
  S.plan[s.id] = false;
  S.efforts[s.id] = '';
  S.models[s.id] = '';
  let r;
  try { r = await api('/api/send', { id: s.id, src: s.src, text: sendText, files, allowEdits, model, effort, plan }); }
  catch (e) { r = { ok: false, error: 'The Hub is not answering.' }; }
  finally { S.sending[s.id] = false; }
  if (r.ok && model) { s.model = model; if ($('#sbadge')) $('#sbadge').innerHTML = badgeHtml(s); }
  if ($('#mpick')) $('#mpick').outerHTML = modelSelect(s);
  if (r.ok && effort && s.live && !s.live.bg) s.effort = effort;
  if ($('#epick')) $('#epick').outerHTML = effortSelect(s);
  if (!r.ok && r.typed) {
    S.pending = null;
    $('#tail').innerHTML = tailHtml(s);
    return toast(r.error);
  }
  if (!r.ok) {
    S.pending = null;
    ta.value = text;
    S.drafts[s.id] = text;
    autosize(ta);
    $('#tail').innerHTML = tailHtml(s);
    return toast(r.error || 'Could not send.');
  }
  s.prompted = Date.now();
  pollState();
}

function renderPage() {
  if (S.page === 'session') renderSession();
  else if (S.page === 'history') renderHistory();
  else if (S.page === 'open') renderHome();
  else if (S.page === 'reminders') renderReminders();
  else if (S.page === 'context') renderContext();
  else if (S.page === 'insights') renderInsights();
  else if (S.page === 'skills') renderSkills();
  else if (S.page === 'new') { const keep = $('#ntext') ? $('#ntext').value : ''; renderNew(); if (keep) $('#ntext').value = keep; }
  else renderToday();

}

// ---------- plan usage card ----------
// Top right, in the empty space beside the page; a small pill when there is no room.
// The x hides it. It comes back by itself at 50, 75, 90 and 100% of either limit,
// and the gauge at the top of the sidebar shows or hides it any time.
const MILESTONES = [50, 75, 90, 100];
const levelOf = (pct) => MILESTONES.filter((m) => pct >= m).length;
const sameWindow = (a, b) => !!(a && b && Math.abs((a.resetsAt || 0) - (b.resetsAt || 0)) < 120000);
const usageHidden = () => localStorage.getItem('hub-usage-hidden') === '1';
function lsJson(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function usageWindows() {
  const u = S.usage;
  if (!u) return [];
  return [['five', '5-hour limit', '5h'], ['week', 'Weekly limit', 'Week']].filter(([k]) => u[k]).map(([k, label, short]) => {
    const w = u[k];
    const over = !!(w.resetsAt && w.resetsAt < Date.now());
    return { k, label, short, pct: over ? 0 : w.pct, resetsAt: w.resetsAt, over };
  });
}
function setUsageData(u) {
  const sig = JSON.stringify(u || null);
  if (sig === S.usageSig) return;
  S.usageSig = sig;
  S.usage = u || null;
  let seen = lsJson('hub-usage-seen');
  const first = !seen;
  seen = seen || {};
  let crossed = null;
  for (const w of usageWindows()) {
    const base = sameWindow(seen[w.k], w) ? seen[w.k].lvl : 0;
    const lvl = levelOf(w.pct);
    if (lvl > base && !first) crossed = crossed && crossed.pct > w.pct ? crossed : w;
    seen[w.k] = { lvl: Math.max(lvl, base), resetsAt: w.resetsAt };
  }
  localStorage.setItem('hub-usage-seen', JSON.stringify(seen));
  if (crossed) {
    localStorage.removeItem('hub-usage-hidden');
    S.usageFlash = true;
    const name = crossed.k === 'five' ? '5-hour' : 'weekly';
    toast(crossed.pct >= 100 ? `You've hit your ${name} limit. It resets ${fmtDue(crossed.resetsAt)}.` : `You've used ${Math.round(crossed.pct)}% of your ${name} limit.`);
  }
  renderUsage();
}
function renderUsage() {
  const box = $('#usage');
  if (!box) return;
  const hidden = usageHidden();
  $('#usagebtn').classList.toggle('on', !hidden);
  $('#usagebtn').title = hidden ? 'Show plan usage' : 'Hide plan usage';
  box.hidden = hidden;
  if (hidden) return;
  const wins = usageWindows();
  const sev = (p) => (p >= 90 ? 'danger' : p >= 75 ? 'warn' : '');
  const reset = (w) => (w.over ? 'New window started' : w.resetsAt ? 'Resets ' + fmtDue(w.resetsAt) : '');
  const rows = wins.length
    ? wins.map((w) => `<div class="urow"><div class="utop"><span>${w.label}</span><b>${Math.round(w.pct)}%</b></div><div class="ubar ${sev(w.pct)}"><i style="width:${Math.min(100, w.pct)}%"></i></div><div class="uwhen">${esc(reset(w))}</div></div>`).join('')
    : '<div class="urow uwhen">Shows up after Claude\'s next reply.</div>';
  const pill = wins.length ? wins.map((w) => `<span class="${sev(w.pct)}">${w.short} ${Math.round(w.pct)}%</span>`).join('<span class="sep">·</span>') : 'Usage';
  const at = S.usage && S.usage.at;
  box.innerHTML = `<div class="uhead"><span>Plan usage</span><button class="iconbtn" data-uact="hide" title="Hide. It comes back at 50, 75 and 90%.">${icon('x')}</button></div>${rows}`
    + (at ? `<div class="uwhen ufoot">Updated ${ago(at) === 'now' ? 'just now' : ago(at) + ' ago'}</div>` : '')
    + `<button class="upill" data-uact="open" title="Plan usage">${pill}</button>`;
  if (S.usageFlash) { S.usageFlash = false; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
  placeUsage();
}
function placeUsage() {
  const box = $('#usage');
  if (!box || box.hidden) return;
  const main = $('#main').getBoundingClientRect();
  const view = $('#view');
  const contentRight = view.getBoundingClientRect().right - (parseFloat(getComputedStyle(view).paddingRight) || 0);
  const room = main.right - contentRight - 24;
  box.classList.toggle('compact', room < 200 && !S.usageOpen);
  box.style.top = Math.round(main.top + 12) + 'px';
  box.style.right = Math.round(window.innerWidth - main.right + 12) + 'px';
}
$('#usage').addEventListener('click', (e) => {
  const b = e.target.closest('[data-uact]');
  if (!b) return;
  if (b.dataset.uact === 'open') { S.usageOpen = true; return placeUsage(); }
  localStorage.setItem('hub-usage-hidden', '1');
  S.usageOpen = false;
  renderUsage();
  toast('Usage hidden. It comes back at 50, 75 and 90%. The gauge at the top left shows it any time.');
});
$('#usagebtn').onclick = () => {

window.addEventListener('resize', placeUsage);

function go(page, id) {

}

// Archive and Delete from the sidebar row, without opening the chat.
// Open any chat in Terminal. An open tab is just focused; a background reply is stopped
// first (two copies on one chat would fight), then the chat resumes in a new window.
async function openInTerminal(s) {
  if (!s) return;
  if (s.live && !s.live.bg) {
    return focusTab(s.live.pid);
  }
  if (s.live && s.live.bg) {
    if (s.live.status === 'busy' && !confirm(`"${s.title}" is replying in the background. Stop that reply and open the chat in Terminal?`)) return;
    const c = await api('/api/close', { id: s.id, force: true });
    if (!c.ok) return toast(c.error || 'Could not stop the background reply.');
  }
  const r = await api('/api/resume', { id: s.id, src: s.src });
  toast(r.ok ? 'Opened in a new Terminal window.' : r.error || 'Could not open Terminal.');
  if (r.ok) setTimeout(loadAll, 2500);
}

async function sideAct(act, id) {
  const s = S.byId.get(id);
  if (!s) return;
  if (act === 'archive') {
    await saveMeta(s, { archived: !s.archived });
    toast(s.archived ? 'Archived. It is under Chats, History, Archived.' : 'Back in the list.');
    return renderAll();
  }
  if (act === 'delete') {
    const busy = !!(s.live && s.live.status === 'busy');
    const where = !s.live ? '' : s.live.bg ? '\n\nIt is running in the background, so that reply gets stopped first.' : `\n\nIt is open in Terminal${s.live.tty ? ' (' + s.live.tty + ')' : ''}, so Claude there gets ended and the tab closes too.${busy ? ' It is working right now, so its current step gets cut off.' : ''}`;
    if (!confirm(`Delete "${s.title}"?${where}\n\nIt leaves the Hub. The transcript moves to ~/.session-dashboard/trash, so it can still be put back by hand.`)) return;
    const r = await api('/api/delete', { id: s.id, src: s.src, force: true });
    if (!r.ok) return toast(r.error || 'Could not delete that chat.');
    S.sessions = S.sessions.filter((x) => x.id !== id);
    S.byId.delete(id);
    if (S.sel === id && S.page === 'session') go('open');
    toast(r.closed === 'tab' ? 'Closed its tab and deleted it.' : r.closed === 'claude' ? 'Ended Claude and deleted it. Its tab may still be open.' : r.closed === 'background' ? 'Stopped the background reply and deleted it.' : 'Deleted.');
    await loadAll();
    return;
  }
}

  const ex = e.target.closest('[data-expand]');

  const kt = e.target.closest('[data-ktab]');
  if (kt) { S.ktab = kt.dataset.ktab; return renderSkills(); }

  if (a) {

    }

      const r = await api('/api/send', { id: s.id, src: s.src, text: a.dataset.text });

    if (act === 'retryedits') {

      return sendMsg({ text: st.lastText.split('\n\nAttached files (read them):')[0], files: st.lastFiles || [] });
    }
    if (act === 'newsend') return startNew();
    if (act === 'mic') return voiceToggle(a);
    if (act === 'cancel') { await api('/api/cancel', { id: s.id }); S.pending = null; return pollState(); }
    if (act === 'panel') { S.panel = S.panel === a.dataset.panel ? '' : a.dataset.panel; return renderSession(); }
    if (act === 'seenall') return hubDo({ action: 'seenAll' });
    if (act === 'toggleform') { S.expand.form = !S.expand.form; renderToday(); return $('.rtext') && $('.rtext').focus(); }
    if (act === 'handoff') return openHandoff(S.byId.get(a.dataset.sid));
    if (act === 'droppending') { S.pending = null; return ($('#tail').innerHTML = tailHtml(s)); }
    if (act === 'palette') { S.palOpen = true; S.palQuery = ''; palIndex = 0; return renderPalette(); }
    if (act === 'planoff') { S.plan[s.id] = false; return ($('#quick').innerHTML = quickHtml(s)); }
    if (act === 'openterm') return openInTerminal(S.byId.get(a.dataset.sid));
    if (act === 'closetabs') {
      const n = tabChats().filter((x) => x.live.status !== 'busy').length;
      if (S.closingTabs) return;
      if (!n) return toast('Every Terminal chat is working right now. Try again when they finish.');
      if (!confirm(`Close ${n} Terminal ${n === 1 ? 'window' : 'windows'}? This ends Claude in each one. Every chat stays in your list here, and replying from here carries it on in the background. Chats that are working, running a command or waiting for approval are left open.`)) return;
      S.closingTabs = true;
      renderPage();
      toast(`Closing ${n} ${n === 1 ? 'window' : 'windows'}. This takes a few seconds each.`);
      let r;
      try { r = await api('/api/closetabs', {}); } catch (err) { r = { ok: false }; }
      S.closingTabs = false;
      if (!r.ok) toast(r.error || 'Could not close them.');
      else toast(`Closed ${r.closed} ${r.closed === 1 ? 'chat' : 'chats'}.` + (r.kept.length ? ` Left ${r.kept.length} open: ${[...new Set(r.kept.map((k) => k.why))].join(', ')}.` : ''));
      await loadAll();
      return;
    }
    if (act === 'closechat') {
      const t = S.byId.get(a.dataset.sid);
      if (!t || !t.live) return;

      const r = await api('/api/close', { id: t.id, force: busy });
      if (!r.ok) return toast(r.error || 'Could not close it.');

      return;
    }

    if (act === 'kadd' || act === 'kauditall') {
      const target = act === 'kadd' ? $('#kadd').value.trim() : '';
      if (act === 'kadd' && !target) return toast('Paste a link or describe the skill.');
      const kind = act === 'kauditall' ? 'auditall' : /^(https?:|npx |[\w.-]+\/[\w.-]+(@[\w.-]+)?$)/.test(target) ? 'add' : 'create';
      const r = await api('/api/ask', { kind, target });
      return toast(r.ok ? 'Opened Claude in Terminal. Approve the steps there.' : r.error || 'Could not open Terminal.');
    }
    if (act === 'krouter') {
      const v = $('#krouter').value.trim();

      S.routerHits = r.ok ? r.hits : [];
      renderSkills();
      $('#krouter').value = v;
      return;
    }
    if (act.startsWith('k')) {
      const k = (S.skills || []).find((x) => x.key === a.closest('[data-key]').dataset.key);
      if (k) return skillAct(act, k);
      return;
    }
    if (act === 'radd') {
      const f = a.closest('[data-form]');
      let text = f.querySelector('.rtext').value.trim();
      const date = f.querySelector('.rdate').value;
      let due = date ? dueFromInput(date, f.querySelector('.rtime').value) : 0;
      const parsed = !f.dataset.manual && text !== f.dataset.prefill && parseWhen(text);
      if (parsed && parsed.text) { text = parsed.text; due = parsed.due; }
      if (!text || !due) return toast('Add some text and a date.');
      const sid = f.dataset.session;
      const linked = sid ? S.byId.get(sid) : null;
      const r = await hubDo({ action: 'add', text, due, repeat: f.querySelector('.rrepeat').value, sessionId: sid, src: linked ? linked.src : '' });
      if (r.ok) toast('Reminder set for ' + fmtDue(due) + '.');
      if (S.page === 'session') renderSession();
      return;
    }
    if (act === 'rdone') return hubDo({ action: 'done', id: rid });
    if (act === 'rundo') return hubDo({ action: 'undo', id: rid });
    if (act === 'rdel') return hubDo({ action: 'delete', id: rid });
    if (act === 'rsnooze') { const until = snoozeTo(a.dataset.when); toast('Snoozed to ' + fmtDue(until) + '.'); return hubDo({ action: 'snooze', id: rid, until }); }
    if (act === 'testnotify') { const r = await api('/api/test-notification', {}); return toast(r.ok ? 'Sent. Did a notification appear in the top right?' : r.error || 'Could not send.'); }

      if (act === 'sedit') { S.editing = { kind: 'sug', id: x.id }; return renderPage(); }
      if (act === 'sdismiss') { await hubDo({ action: 'dismiss', sugId: x.id, sugText: x.text, sugDue: x.due }); return toast('Deleted. Ones like it will be hidden too.'); }
      if (act === 'srestore') { await hubDo({ action: 'undismiss', sugId: x.id, sugText: x.text }); return toast('Restored. Ones like it will show again.'); }
      const r = await hubDo({ action: 'add', text: x.text, due: x.due, repeat: x.repeat || '', sessionId: x.sessionId, src: x.src, sugId: x.id, sugText: x.text });
      if (r.ok) toast('Reminder set for ' + fmtDue(x.due) + (x.repeat ? ', ' + REPEAT_LABEL[x.repeat].toLowerCase() : '') + '.');
      return;
    }
    if (act === 'redit') { S.editing = { kind: 'rem', id: rid }; return renderPage(); }
    if (act === 'ecancel') { S.editing = null; return renderPage(); }
    if (act === 'esave') {

      const due = dueFromInput(f.querySelector('.edate').value, f.querySelector('.etime').value);

      const kind = f.dataset.edit, id = f.dataset.eid;

      const x = (S.hub.suggestions || []).find((q) => q.id === id);
      const r = await hubDo({ action: 'add', text, due, repeat, sessionId: x && x.sessionId, src: x && x.src, sugId: id, sugText: x ? x.text : text });
      if (r.ok) toast('Reminder set for ' + fmtDue(due) + '.');
      return;
    }
    if (act === 'copy') { await navigator.clipboard.writeText(s.resume); return toast('Copied. Paste it in any terminal.'); }
    if (act === 'resume') return openInTerminal(s);
    if (act === 'pin') { await saveMeta(s, { pinned: !s.pinned }); return renderAll(); }
    if (act === 'archive') { await saveMeta(s, { archived: !s.archived }); toast(s.archived ? 'Archived. It is under History, Archived.' : 'Back in the list.'); return renderAll(); }
    if (act === 'all') { S.threadAll = true; return fetchThread(s, false); }
    return;
  }
  const pi = e.target.closest('[data-pi]');
  if (pi) return pickPalette(Number(pi.dataset.pi));

  const row = e.target.closest('[data-id]');
  if (row) open(row.dataset.id);
};

});

$('#view').addEventListener('change', async (e) => {
  if (e.target.id === 'mpick' && S.sel) { S.models[S.sel] = e.target.value; return; }
  if (e.target.id === 'epick' && S.sel) { S.efforts[S.sel] = e.target.value; return; }
  const s = cur();
  if (!s) return;
  if (e.target.id === 'stag') { await api('/api/meta', { id: s.id, patch: { tag: e.target.value } }); await loadAll(); }
  if (e.target.id === 'snote') { await saveMeta(s, { note: e.target.value.trim() }); toast('Note saved.'); }
  if (e.target.id === 'stitle') {
    const v = e.target.value.trim();
    await api('/api/meta', { id: s.id, patch: { title: v === s.autoTitle ? '' : v } });
    s.title = v || s.autoTitle;
    e.target.value = s.title;
    renderSide();
  }
});
$('#view').addEventListener('toggle', (e) => { const f = e.target.closest && e.target.closest('[data-fold]'); if (f) S.expand[f.dataset.fold] = f.open; }, true);
$('#view').addEventListener('input', (e) => {
  if (e.target.classList && e.target.classList.contains('rtext')) {
    const f = e.target.closest('[data-form]');
    const pv = f.querySelector('.rpreview');
    const r = !f.dataset.manual && parseWhen(e.target.value);
    if (pv) pv.textContent = r ? '→ ' + fmtDue(r.due) + (r.text ? ': ' + r.text : '') : '';
    return;
  }
  if (e.target.classList && (e.target.classList.contains('rdate') || e.target.classList.contains('rtime'))) { const f = e.target.closest('[data-form]'); f.dataset.manual = '1'; const pv = f.querySelector('.rpreview'); if (pv) pv.textContent = ''; return; }
  if (e.target.id === 'kq') { S.kq = e.target.value; return renderSkills(); }
  if (e.target.id === 'ctext' || e.target.id === 'ntext') {
    if (e.target.id === 'ctext') { S.drafts[S.sel] = e.target.value; autosize(e.target); }
    const v = e.target.value;
    if (/^\/\S*$/.test(v)) { S.palOpen = true; S.palQuery = v; palIndex = 0; renderPalette(); }
    else if (S.palOpen && !S.palQuery) { /* opened by button; keep */ }
    else if (S.palOpen) closePalette();
  }
});
$('#view').addEventListener('keydown', (e) => {
  if (S.palOpen && (e.target.id === 'ctext' || e.target.id === 'ntext')) {
    const n = ($('#palette') && $('#palette')._list || []).length;
    if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = (palIndex + 1) % Math.max(1, n); return renderPalette(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = (palIndex - 1 + n) % Math.max(1, n); return renderPalette(); }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pickPalette(palIndex); }
    if (e.key === 'Escape') { e.preventDefault(); return closePalette(); }
  }
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.id === 'stitle' || t.id === 'snote') return t.blur();
  if (t.id === 'ctext' && !e.shiftKey) { e.preventDefault(); return sendMsg(); }
  if (t.id === 'ntext' && !e.shiftKey) { e.preventDefault(); return startNew(); }
  if (t.classList && t.classList.contains('etext')) { e.preventDefault(); return t.closest('[data-edit]').querySelector('[data-act="esave"]').click(); }
  if (t.id === 'krouter') { e.preventDefault(); return $('[data-act="krouter"]').click(); }
  if (t.id === 'kadd') { e.preventDefault(); return $('[data-act="kadd"]').click(); }
  if (t.classList.contains('rtext')) { e.preventDefault(); t.closest('[data-form]').querySelector('[data-act="radd"]').click(); }
});

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape') { if (typing) document.activeElement.blur(); else if (S.page === 'session') go(lastList); }
});

// ---------- voice dictation (Claude Code's /voice, on local Whisper) ----------
//
// Hold Space in a chat box to talk and let go to drop the words in at the cursor.
// In tap mode (voice.mode "tap" in ~/.claude/settings.json) tap Space on an empty box
// to start and again to finish and send. The mic button starts and stops it with a
// click and never sends by itself. Esc or Ctrl+C cancels, Enter finishes and sends.
// The server turns speech into text on this Mac with Whisper; nothing leaves it.

const V = { state: 'idle', r: null, el: null, raf: 0, warmAt: 0, holdKey: false, spaceAt: null, cfg: { mode: 'hold', autoSubmit: false, lang: 'en' } };
const VOICE_MIN = 0.008; // mic level that counts as speech

function micTitle() { return V.cfg.mode === 'tap' ? 'Talk instead of typing (or tap Space in an empty box)' : 'Talk instead of typing (or hold Space)'; }
function voiceHint() { return V.cfg.mode === 'tap' ? ' Tap Space in an empty box to talk.' : ' Hold Space to talk.'; }

async function voiceLoad() {
  try { Object.assign(V.cfg, await api('/api/voice')); } catch (e) {}
}
// Loads the speech model ahead of time (about 5 s) once you start using a chat box.
function voiceWarm() {
  if (Date.now() - V.warmAt < 60000) return;
  V.warmAt = Date.now();
  fetch('/api/voice?warm=1').then((r) => r.json()).then((r) => Object.assign(V.cfg, r)).catch(() => {});
}

async function voiceStart(how, ta) {
  if (V.state !== 'idle' || !ta || ta.disabled) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('This browser cannot use the microphone here.');
  if (document.activeElement !== ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  const r = { how, target: ta.id, ta, pos: ta.selectionStart, sid: ta.id === 'ctext' ? S.sel : '', id: Math.random().toString(36).slice(2, 12), chunks: [], len: 0, carry: new Float32Array(0), level: 0, heard: false, text: '', inflight: false, sentLen: 0, sendAfter: false, stopWanted: false, startedAt: Date.now(), lastVoiceAt: Date.now() };
  V.r = r;
  V.state = 'starting';
  voiceWarm();
  voiceUi();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    if (V.r === r) { V.r = null; V.state = 'idle'; voiceUi(); }
    return toast(e && e.name === 'NotAllowedError' ? 'The microphone is blocked for the Hub. Allow it from the icon at the left of the address bar.' : 'No microphone found.');
  }
  if (V.r !== r) { stream.getTracks().forEach((t) => t.stop()); return; } // cancelled while the mic was opening
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = (ev) => voiceChunk(r, ev.inputBuffer.getChannelData(0));
  src.connect(proc);
  proc.connect(ctx.destination); // needed for it to run; it outputs silence
  Object.assign(r, { stream, ctx, src, proc, ratio: ctx.sampleRate / 16000, startedAt: Date.now(), lastVoiceAt: Date.now() });
  r.tick = setInterval(() => voiceTick(r), 250);
  V.state = 'rec';
  voiceUi();
  if (r.stopWanted) voiceStop();
}

// Keeps a running 16 kHz copy of the mic (averaged down from the device rate) and its level.
function voiceChunk(r, data) {
  if (V.r !== r || V.state !== 'rec') return;
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  r.level = Math.max(rms, r.level * 0.8);
  if (rms > VOICE_MIN) { r.heard = true; r.lastVoiceAt = Date.now(); }
  const inp = new Float32Array(r.carry.length + data.length);
  inp.set(r.carry);
  inp.set(data, r.carry.length);
  const n = Math.floor(inp.length / r.ratio);
  const out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * r.ratio);
    const b = Math.max(a + 1, Math.floor((i + 1) * r.ratio));
    let s = 0;
    for (let j = a; j < b; j++) s += inp[j];
    out[i] = Math.max(-1, Math.min(1, s / (b - a))) * 32767;
  }
  r.carry = inp.slice(Math.floor(n * r.ratio));
  r.chunks.push(out);
  r.len += n;
}

function voicePcm(r) {
  if (r.chunks.length === 1) return r.chunks[0];
  const all = new Int16Array(r.len);
  let o = 0;
  for (const c of r.chunks) { all.set(c, o); o += c.length; }
  r.chunks = [all];
  return all;
}

async function voicePost(r, final) {
  const pcm = voicePcm(r);
  try {
    const res = await fetch(`/api/voice?rec=${r.id}&final=${final ? 1 : 0}&sid=${encodeURIComponent(r.sid || '')}`, { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-sessions': '1' }, body: pcm });
    return await res.json();
  } catch (e) { return { ok: false, error: 'The Hub is not answering.' }; }
}

function voiceTick(r) {
  if (V.r !== r || V.state !== 'rec') return clearInterval(r.tick);
  const now = Date.now();
  if (now - r.startedAt > 120000) { toast('Stopped at the 2-minute limit.'); return voiceStop(); }
  if (r.how !== 'hold' && now - r.lastVoiceAt > 15000) { toast('Stopped after 15 seconds of quiet.'); return voiceStop(); }
  // Live preview: re-read everything so far about once a second while you talk.
  if (!r.inflight && r.heard && r.len >= 12000 && r.len - r.sentLen >= 12000) {
    r.inflight = true;
    r.sentLen = r.len;
    voicePost(r, false).then((res) => {
      r.inflight = false;
      if (V.r === r && V.state === 'rec' && res.ok && res.text) { r.text = res.text; voiceUi(); }
    });
  }
}

function voiceRelease(r) {
  clearInterval(r.tick);
  try { r.proc && r.proc.disconnect(); r.src && r.src.disconnect(); } catch (e) {}
  if (r.stream) r.stream.getTracks().forEach((t) => t.stop());
  if (r.ctx) r.ctx.close().catch(() => {});
}

function voiceDone() { V.r = null; V.state = 'idle'; voiceUi(); }

async function voiceStop() {
  const r = V.r;
  if (!r) return;
  if (V.state === 'starting') { r.stopWanted = true; return; }
  if (V.state !== 'rec') return;
  voiceRelease(r);
  V.state = 'finishing';
  voiceUi();
  if (r.len < 4800) { voiceDone(); return toast(r.how === 'hold' ? 'Keep holding Space while you talk.' : 'That was too short to hear anything.'); }
  if (!r.heard) { voiceDone(); return toast('No speech detected. Check the Mac\'s input level in Sound settings.'); }
  const res = await voicePost(r, true);
  if (V.r !== r) return; // cancelled while it was being turned into text
  voiceDone();
  if (!res.ok) return toast(res.error || 'Could not turn that into text.');
  const text = String(res.text || '').trim();
  if (!text) return toast('No speech detected.');
  voiceInsert(r, text);
}

function voiceCancel() {
  const r = V.r;
  if (!r) return;
  voiceRelease(r);
  voiceDone();
  toast('Dictation cancelled.');
}

// Puts the words in at the cursor, like Claude Code, then sends when the mode says so
// (tap mode or hold with voice.autoSubmit: 3 words or more; Enter while talking: always).
function voiceInsert(r, text) {
  const here = r.target === 'ntext' ? S.page === 'new' : S.page === 'session' && S.sel === r.sid;
  const ta = here ? $('#' + r.target) : null;
  if (!ta) {
    if (r.target === 'ctext' && r.sid) {
      const d = S.drafts[r.sid] || '';
      S.drafts[r.sid] = d + (d && !/\s$/.test(d) ? ' ' : '') + text;
      toast('Added what you said to that chat\'s reply box.');
    }
    return;
  }
  const v = ta.value;
  const a = ta === r.ta ? ta.selectionStart : Math.min(r.pos, v.length);
  const b = ta === r.ta ? ta.selectionEnd : a;
  const pre = v.slice(0, a);
  const post = v.slice(b);
  if (pre.trim() && !/[.!?:]\s*$/.test(pre) && /^[A-Z][a-z]/.test(text) && !/^I\b/.test(text)) text = text[0].toLowerCase() + text.slice(1);
  const lead = pre && !/\s$/.test(pre) ? ' ' : '';
  const trail = post && !/^\s/.test(post) ? ' ' : '';
  ta.value = pre + lead + text + trail + post;
  const caret = (pre + lead + text).length;
  ta.focus();
  ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event('input', { bubbles: true })); // keeps the draft and box size in step
  const words = text.split(/\s+/).filter(Boolean).length;
  const auto = r.sendAfter || ((r.how === 'tap' || (r.how === 'hold' && V.cfg.autoSubmit)) && words >= 3);
  if (auto) (r.target === 'ntext' ? startNew : sendMsg)();
}

function voiceToggle(btn) {
  if (V.state === 'rec' || V.state === 'starting') return voiceStop();
  if (V.state === 'finishing') return;
  const box = btn.closest('.composer-box');
  voiceStart('click', box && box.querySelector('textarea'));
}

function voiceUi() {
  const r = V.r;
  document.querySelectorAll('[data-act="mic"]').forEach((b) => {
    b.classList.toggle('rec', !!r && V.state !== 'finishing');
    b.classList.toggle('busy', V.state === 'finishing');
    b.title = r ? 'Stop and put the words in (Esc cancels)' : micTitle();
  });
  if (!r) {
    if (V.el) V.el.remove();
    cancelAnimationFrame(V.raf);
    V.raf = 0;
    return;
  }
  if (!V.el) {
    V.el = document.createElement('div');
    V.el.className = 'vstrip';
    V.el.innerHTML = '<span class="vdot"></span><span class="vbars"><i></i><i></i><i></i><i></i><i></i></span><span class="vlabel"></span><span class="vtext"></span><span class="vkey"></span>';
  }
  V.el.classList.toggle('starting', V.state === 'starting');
  V.el.classList.toggle('finishing', V.state === 'finishing');
  V.el.querySelector('.vlabel').textContent = V.state === 'starting' ? 'Opening the mic…' : V.state === 'finishing' ? 'Turning it into text…' : 'Listening…';
  const t = r.text.length > 140 ? '…' + r.text.slice(-140) : r.text;
  V.el.querySelector('.vtext').textContent = t;
  V.el.querySelector('.vkey').textContent = V.state === 'finishing' ? 'Esc cancels' : (r.how === 'hold' ? 'Let go of Space to finish' : r.how === 'tap' ? 'Tap Space to send' : 'Click the mic to finish') + ' · Esc cancels';
  if (!V.raf) V.raf = requestAnimationFrame(voiceFrame);
}

// Each frame: move the level bars, and put the strip back if the page re-drew the chat box.
const VBAR = [0.55, 0.8, 1, 0.8, 0.55];
function voiceFrame() {
  V.raf = 0;
  const r = V.r;
  if (!r || !V.el) return;
  const ta = $('#' + r.target);
  const box = ta && ta.closest('.composer-box');
  if (box && V.el.nextElementSibling !== box) box.before(V.el);
  const mic = box && box.querySelector('[data-act="mic"]');
  if (mic && !mic.classList.contains('rec') && V.state !== 'finishing') voiceUi();
  const lv = V.state === 'rec' ? Math.min(1, r.level * 9) : 0;
  V.el.querySelectorAll('.vbars i').forEach((el, i) => { el.style.height = (3 + Math.round(lv * VBAR[i] * 15)) + 'px'; });
  r.level *= 0.92;
  if (!V.raf) V.raf = requestAnimationFrame(voiceFrame);
}

// Keys run before the page's own handlers (capture), so Esc and Enter mean
// "cancel / finish dictation" while it is on, and do their usual job otherwise.
window.addEventListener('keydown', (e) => {
  const t = e.target;
  const inBox = !!t && (t.id === 'ctext' || t.id === 'ntext');
  const space = e.key === ' ' && !e.metaKey && !e.ctrlKey && !e.altKey;
  if (V.state !== 'idle') {
    if (e.key === 'Escape' || (e.ctrlKey && !e.metaKey && String(e.key).toLowerCase() === 'c')) { e.preventDefault(); e.stopImmediatePropagation(); return voiceCancel(); }
    if (space && V.r && V.r.how === 'hold') { e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (space && V.r && V.r.how === 'tap' && inBox && !e.repeat) { e.preventDefault(); e.stopImmediatePropagation(); return voiceStop(); }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && inBox) { e.preventDefault(); e.stopImmediatePropagation(); if (V.r) V.r.sendAfter = true; return voiceStop(); }
    return;
  }
  if (!space) return;
  if (V.holdKey) { e.preventDefault(); return; } // still holding from a try that failed
  if (!inBox || e.isComposing || t.disabled || S.palOpen) return;
  if (V.cfg.mode === 'tap') {
    if (!e.repeat && !t.value.trim()) { e.preventDefault(); voiceStart('tap', t); }
    return;
  }
  // Hold mode: the first press types a space as usual. Key repeat means Space is
  // being held, so take that space back out and start listening.
  if (!e.repeat) { V.spaceAt = { el: t, pos: t.selectionStart + 1 }; return; }
  e.preventDefault();
  V.holdKey = true;
  const sp = V.spaceAt;
  if (sp && sp.el === t && t.selectionStart === sp.pos && t.value[sp.pos - 1] === ' ') {
    t.value = t.value.slice(0, sp.pos - 1) + t.value.slice(sp.pos);
    t.setSelectionRange(sp.pos - 1, sp.pos - 1);
    t.dispatchEvent(new Event('input', { bubbles: true }));
  }
  voiceStart('hold', t);
}, true);
window.addEventListener('keyup', (e) => {
  if (e.key !== ' ') return;
  V.holdKey = false;
  if (V.r && V.r.how === 'hold') { e.preventDefault(); voiceStop(); }
}, true);
window.addEventListener('blur', () => { V.holdKey = false; if (V.r && V.r.how === 'hold') voiceStop(); });
// The mic button must not take focus from the chat box, so the cursor stays put.
document.addEventListener('mousedown', (e) => { if (e.target.closest && e.target.closest('[data-act="mic"]')) e.preventDefault(); });
document.addEventListener('focusin', (e) => { if (e.target.id === 'ctext' || e.target.id === 'ntext') voiceWarm(); });

document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (Date.now() - S.lastFull > 45000 && !typingInView()) loadAll(); else pollLive(); pollState(); } });
setInterval(pollLive, 4000);
setInterval(pollState, 2000);
// Once a minute: refresh reminders (one may have come due) and the relative times.
setInterval(async () => {
  if (document.hidden) return;
  try { await loadHub(); } catch (e) { return; }
  renderSide();
  if ((S.page === 'today' || S.page === 'open' || S.page === 'reminders') && !typingInView() && !S.editing) renderPage();
}, 60000);

voiceLoad();
(async () => {
  const hash = location.hash.slice(1);
  try { await loadAll(); } catch (e) { $('#slist').innerHTML = '<div class="side-empty">The local server is not answering. Run the <b>sessions</b> command again.</div>'; return; }
  if (hash.startsWith('s/') && S.byId.has(hash.slice(2))) go('session', hash.slice(2));
  else if (['open', 'reminders', 'history', 'new', 'context', 'skills', 'insights'].includes(hash)) go(hash);
})();
</script>
