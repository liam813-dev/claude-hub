<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b62b8'/%3E%3Cpath d='M9 11l6 5-6 5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 21h7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem('sd-theme');
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
/* Theme values follow the OpenSEO dashboard so the two feel like one family. */
:root, [data-theme="light"] {
  color-scheme: light;
  --background: oklch(95.5% 0 0);
  --foreground: oklch(20% 0 0);
  --card: oklch(100% 0 0);
  --primary: oklch(50% 0.12 262);
  --primary-foreground: oklch(100% 0 0);
  --secondary: oklch(97% 0 0);
  --muted-foreground: oklch(20% 0 0 / 60%);
  --faint: oklch(20% 0 0 / 40%);
  --hover: oklch(20% 0 0 / 5%);
  --success: oklch(52% 0.15 150);
  --warning: oklch(52% 0.12 70);
  --info: oklch(52% 0.13 240);
  --destructive: oklch(55% 0.2 25);
  --border: oklch(92% 0 0);
  --input: oklch(82% 0 0);
  --sidebar: oklch(91% 0 0);
  --sidebar-accent: oklch(20% 0 0 / 8%);
  --sidebar-border: oklch(86% 0 0);
  --shadow: 0 1px 2px oklch(0% 0 0 / 6%), 0 1px 3px oklch(0% 0 0 / 5%);
}
[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(18% 0 0);
  --foreground: oklch(92% 0 0);
  --card: oklch(23% 0 0);
  --primary: oklch(66% 0.12 262);
  --primary-foreground: oklch(100% 0 0);
  --secondary: oklch(28% 0 0);
  --muted-foreground: oklch(92% 0 0 / 60%);
  --faint: oklch(92% 0 0 / 40%);
  --hover: oklch(100% 0 0 / 6%);
  --success: oklch(74% 0.16 150);
  --warning: oklch(80% 0.14 80);
  --info: oklch(74% 0.12 240);
  --destructive: oklch(72% 0.17 25);
  --border: oklch(30% 0 0);
  --input: oklch(40% 0 0);
  --sidebar: oklch(24% 0 0);
  --sidebar-accent: oklch(100% 0 0 / 8%);
  --sidebar-border: oklch(31% 0 0);
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sidebar);
  color: var(--foreground);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  scrollbar-color: color-mix(in oklch, currentColor 30%, transparent) transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted-foreground); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ---------- sidebar ---------- */
#side { width: 292px; flex: none; display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 14px 8px; display: flex; align-items: center; gap: 4px; }
.side-head .name { all: unset; cursor: pointer; font-size: 16px; font-weight: 600; margin-right: auto; padding-left: 2px; }
.iconbtn { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted-foreground); }
.iconbtn:hover { background: var(--sidebar-accent); color: var(--foreground); }
.iconbtn.spin svg { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.field { position: relative; margin: 0 12px 8px; }
.field svg { position: absolute; left: 10px; top: 10px; color: var(--muted-foreground); }
.field input {
  width: 100%; height: 36px; padding: 0 10px 0 32px;
  background: var(--card); border: 1px solid var(--sidebar-border); border-radius: 8px; outline: none;
}
.field input::placeholder { color: var(--muted-foreground); }
.field input:focus, select:focus-visible, .btn:focus-visible { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 12px 10px; }
select {
  height: 32px; padding: 0 8px; width: 100%;
  background: var(--card); border: 1px solid var(--sidebar-border); border-radius: 8px; outline: none;
}

.nav { padding: 0 8px 4px; }
.navrow {
  all: unset; cursor: pointer; box-sizing: border-box;
  position: relative; display: flex; align-items: center; gap: 8px;
  width: 100%; height: 32px; padding: 0 8px; border-radius: 6px;
  color: color-mix(in oklch, var(--foreground) 70%, transparent);
}
.navrow:hover { background: color-mix(in oklch, var(--sidebar-accent) 60%, transparent); color: var(--foreground); }
.navrow.on { background: var(--sidebar-accent); color: var(--foreground); }
.navrow.on::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.navrow .count { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.navrow .when { margin-left: auto; padding-left: 8px; font-size: 12px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }

.side-item .side-acts { display: none; margin-left: auto; gap: 2px; flex: none; }
.side-item:hover .side-acts, .side-item:focus-within .side-acts { display: inline-flex; }
.side-item:hover .when { display: none; }
.sact { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; color: var(--muted-foreground); cursor: pointer; }
.sact svg { width: 14px; height: 14px; }
.sact:hover { background: var(--card); color: var(--foreground); }
.sact.danger:hover { color: var(--destructive); }
#slist { flex: 1; overflow-y: auto; min-height: 0; padding: 0 8px 16px; }
.glabel { height: 28px; display: flex; align-items: center; padding: 0 8px; margin-top: 8px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); }
.side-empty { padding: 10px 8px; color: var(--muted-foreground); }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); opacity: 0.6; }
.dot.busy { background: var(--success); animation: pulse 1.6s ease-in-out infinite; }
.dot.stale { background: var(--warning); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--success) 50%, transparent); } 60% { box-shadow: 0 0 0 5px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.busy, .iconbtn.spin svg { animation: none; } }

/* ---------- main panel ---------- */
#main { flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: var(--background); border-radius: 12px; box-shadow: var(--shadow); overflow-y: auto; }
.page { max-width: 1000px; margin: 0 auto; padding: 28px 32px 80px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted-foreground); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { all: unset; cursor: pointer; position: relative; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; font-weight: 500; color: var(--muted-foreground); }
.tab:hover { color: var(--foreground); }
.tab.on { color: var(--foreground); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--foreground); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { padding: 16px 18px; }
.stat .label { color: var(--muted-foreground); font-size: 13px; }
.stat .num { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }

.group { margin-bottom: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.card-head .sq { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--faint)); }
.card-head .count { color: var(--muted-foreground); font-size: 13px; }

.srow { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
.srow:last-child { border-bottom: none; }
.srow:hover { background: var(--hover); }
.srow-main { flex: 1; min-width: 0; }
.srow-title { font-weight: 500; }
.srow-sub { color: var(--muted-foreground); font-size: 13px; margin-top: 1px; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); color: var(--muted-foreground); flex: none; }
.badge.success { color: var(--success); border-color: color-mix(in oklch, var(--success) 30%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); }
.badge.warning { color: var(--warning); border-color: color-mix(in oklch, var(--warning) 35%, transparent); background: color-mix(in oklch, var(--warning) 12%, transparent); }
.badge.info { color: var(--info); border-color: color-mix(in oklch, var(--info) 30%, transparent); background: color-mix(in oklch, var(--info) 10%, transparent); }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; flex: none;
  background: color-mix(in oklab, var(--c) 14%, transparent); color: color-mix(in oklab, var(--c) 70%, var(--foreground)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent); }
.chip.none { --c: #94a3b8; }

.btn { all: unset; cursor: pointer; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; font-weight: 500; white-space: nowrap; flex: none; transition: background 0.12s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-foreground); }
.btn.primary:hover { background: color-mix(in oklch, var(--primary) 82%, transparent); }
.btn.outline { background: var(--card); border-color: var(--border); box-shadow: var(--shadow); }
[data-theme="dark"] .btn.outline { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
.btn.outline:hover { background: var(--hover); }
[data-theme="dark"] .btn.outline:hover { background: color-mix(in oklch, var(--input) 50%, transparent); }
.btn.ghost { color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--hover); color: var(--foreground); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 6px; }
.btn.active { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 40%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); }

.card table { width: 100%; border-collapse: collapse; }
.card th { text-align: left; font-weight: 500; color: var(--muted-foreground); font-size: 13px; padding: 10px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.card td { padding: 10px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.card tbody tr { cursor: pointer; }
.card tbody tr:hover { background: var(--hover); }
.card tbody tr:last-child td { border-bottom: none; }
.card td.t { max-width: 0; width: 100%; }
.card td.r, .card th.r { text-align: right; white-space: nowrap; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.msg .tbl { white-space: normal; overflow-x: auto; margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.msg .tbl table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.45; }
.msg .tbl th { text-align: left; font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.msg .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.msg .tbl tr:last-child td { border-bottom: none; }
.tfoot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; color: var(--muted-foreground); }
.empty { padding: 40px 18px; text-align: center; color: var(--muted-foreground); }

/* ---------- session view ---------- */
.session { max-width: 820px; }
.s-title { width: 100%; border: none; outline: none; background: transparent; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; padding: 4px 6px; margin: 10px -6px 0; border-radius: 8px; text-overflow: ellipsis; }
.s-title:hover { background: var(--hover); }
.s-title:focus { background: var(--card); box-shadow: 0 0 0 1px var(--border); }
.s-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 16px; color: var(--muted-foreground); font-size: 13px; }
.s-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.s-actions select { width: auto; height: 36px; border-color: var(--border); }
.s-note { width: 100%; height: 38px; margin-top: 12px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none; }
.s-note::placeholder { color: var(--muted-foreground); }
.s-note:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }

details.info { margin-top: 12px; }
details.info summary { cursor: pointer; list-style: none; padding: 11px 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
details.info summary::-webkit-details-marker { display: none; }
details.info summary svg { transition: transform 0.12s; color: var(--muted-foreground); }
details.info[open] summary svg { transform: rotate(90deg); }
details.info[open] summary { border-bottom: 1px solid var(--border); }
.facts { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 16px; margin: 0; padding: 14px 16px; }
.facts dt { color: var(--muted-foreground); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts a { color: var(--primary); text-decoration: none; }
.facts a:hover { text-decoration: underline; }

.thread { margin-top: 28px; }
.thread-head { display: flex; align-items: center; gap: 12px; color: var(--muted-foreground); font-size: 13px; margin-bottom: 8px; }
.thread-head .line { flex: 1; border-top: 1px solid var(--border); }
.linkbtn { all: unset; cursor: pointer; color: var(--primary); font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
.msg.u { width: fit-content; max-width: 85%; margin: 26px 0 16px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px 16px 4px 16px; padding: 10px 14px; box-shadow: var(--shadow); }
.when-u { display: block; text-align: right; font-size: 12px; color: var(--faint); margin: 26px 2px -22px 0; }
.msg.t { white-space: normal; font-size: 13px; color: var(--muted-foreground); margin: -4px 0 12px; }
.msg.t summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; margin-left: -4px; border-radius: 6px; }
.msg.t summary::-webkit-details-marker { display: none; }
.msg.t summary:hover { background: var(--hover); color: var(--foreground); }
.msg.t summary svg { width: 14px; height: 14px; transition: transform 0.12s; }
.msg.t[open] summary svg { transform: rotate(90deg); }
.msg.t .acts { margin: 6px 0 0 6px; padding-left: 12px; border-left: 2px solid var(--border); }
.msg.t .acts div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.t .acts b { color: var(--foreground); font-weight: 500; }
.msg pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.5; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 8px 0; white-space: pre; }
.msg code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.87em; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.msg .h { display: inline-block; font-size: 1.06em; font-weight: 600; margin-top: 4px; }
.msg a { color: var(--primary); }
.note-line { color: var(--muted-foreground); padding: 28px 0; }

/* ---------- hub: reminders, new session, chat ---------- */
.newbtn { margin: 0 12px 8px; width: calc(100% - 24px); }
.navrow .pill { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--primary); color: var(--primary-foreground); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; }
.unread { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex: none; margin-left: auto; }
.unread + .when { margin-left: 0; }
.badge.danger { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 35%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); }
.badge.primary { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 35%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); }
.card-head .hint { margin-left: auto; color: var(--muted-foreground); font-size: 13px; }
.srow.plain { cursor: default; }
.srow.plain:hover { background: transparent; }
.check { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--input); display: grid; place-items: center; flex: none; color: transparent; }
.check:hover { border-color: var(--success); color: var(--success); }
.check.on { background: var(--success); border-color: var(--success); color: var(--card); }
.check svg { width: 12px; height: 12px; stroke-width: 3; }
.srow-title.done { text-decoration: line-through; color: var(--muted-foreground); }
.sublink { all: unset; cursor: pointer; color: var(--primary); }
.sublink:hover { text-decoration: underline; }
.form { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; align-items: center; }
.form input[type="text"], .form input[type="date"] { height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none; }
[data-theme="dark"] .form input, [data-theme="dark"] .form select { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
.form input[type="text"] { flex: 1; min-width: 200px; }
.form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }
.form select { width: auto; height: 36px; border-color: var(--border); }
.quick { display: flex; gap: 6px; }

.page.session { padding-top: 0; padding-bottom: 0; min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 3; background: var(--background); border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.topbar-row { display: flex; align-items: center; gap: 6px; padding: 10px 0; }
.topbar .s-title { margin: 0; font-size: 17px; flex: 1; min-width: 0; padding: 5px 8px; }
.topbar .iconbtn:hover { background: var(--hover); }
.topbar .iconbtn.on { color: var(--primary); }
.panel { border-top: 1px solid var(--border); padding: 12px 0 14px; }
.panel .form { padding: 0; }
.panel .s-meta { margin: 0 0 10px; }
.panel .facts { padding: 12px 0 0; }
.panel .s-note { margin-top: 0; }
.thread { margin-top: 12px; flex: 1; }
.msg.u.pending { opacity: 0.55; }
.status-line { display: flex; align-items: center; gap: 10px; color: var(--muted-foreground); font-size: 13px; margin: 4px 0 12px; }
.status-line.err { color: var(--destructive); align-items: flex-start; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.composer { position: sticky; bottom: 0; z-index: 3; padding: 14px 0 14px; background: linear-gradient(to bottom, transparent, var(--background) 14px); }
.composer-box { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 8px 8px 8px 16px; }
[data-theme="dark"] .composer-box { border-color: var(--input); }
.composer-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }
.composer-box textarea { flex: 1; border: none; outline: none; background: transparent; resize: none; font-size: 15px; line-height: 1.5; padding: 7px 0; max-height: 220px; min-height: 36px; }
.composer-box textarea::placeholder { color: var(--muted-foreground); }
.sendbtn { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); flex: none; }
.sendbtn:hover { background: color-mix(in oklch, var(--primary) 82%, transparent); }
.sendbtn[disabled] { opacity: 0.4; cursor: default; }
.composer .hint { font-size: 12px; color: var(--muted-foreground); margin: 7px 6px 0; }
.newbox { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.newbox label { font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
.newbox select { height: 36px; border-color: var(--border); max-width: 460px; }

/* ---------- context + skills ---------- */

.meter .bar { width: 64px; height: 6px; border-radius: 99px; background: color-mix(in oklch, var(--foreground) 10%, transparent); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 99px; background: var(--success); }
.meter.mid .bar i { background: var(--warning); }
.meter.high .bar i { background: var(--destructive); }

.meter.wide .bar { width: 160px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar input[type="text"] { flex: 1; min-width: 220px; height: 36px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none; }
.toolbar input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }
[data-theme="dark"] .toolbar input[type="text"] { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
.sk-desc { color: var(--muted-foreground); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sk-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.srow.top { align-items: flex-start; }
.router-hits { padding: 0 18px 14px; display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted-foreground); font-size: 13px; }
.drawer-bg { position: fixed; inset: 0; background: oklch(0% 0 0 / 35%); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(760px, 100%); height: 100%; background: var(--background); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.drawer-head h2 { margin: 0; font-size: 16px; }
.drawer-body { overflow-y: auto; padding: 18px 22px 40px; }
.drawer-body .msg { font-size: 14px; }

/* ---------- attachments, stop, live status ---------- */
.composer-box .iconbtn { width: 36px; height: 36px; border-radius: 10px; }
.modelpick { width: auto; height: 32px; margin-bottom: 2px; border: 1px solid var(--border); border-radius: 8px; background: transparent; font-size: 13px; color: var(--muted-foreground); padding: 0 6px; cursor: pointer; }
.modelpick:hover { color: var(--foreground); }
.composer-box .iconbtn:hover { background: var(--hover); }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.att { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 4px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; max-width: 240px; }
.att img { width: 36px; height: 36px; object-fit: cover; border-radius: 7px; }
.att .ficon { width: 36px; height: 36px; border-radius: 7px; display: grid; place-items: center; background: var(--hover); color: var(--muted-foreground); }
.att .x { all: unset; cursor: pointer; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--foreground); color: var(--background); display: grid; place-items: center; }
.att .x svg { width: 11px; height: 11px; stroke-width: 3; }
.att.loading { opacity: 0.55; }
.quickrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--primary); }
.btn.stop { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 8%, transparent); }
.btn.stop:hover { background: color-mix(in oklch, var(--destructive) 16%, transparent); }
.status-line .now { color: var(--foreground); }
.alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; margin: 6px 0 14px; font-size: 14px; border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); background: color-mix(in oklch, var(--warning) 10%, transparent); }
.alert .body { flex: 1; min-width: 0; }
.alert .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg .thumbs img { max-width: 160px; max-height: 120px; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; }
.msg .thumbs .fchip { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--hover); }
.msg.n { font-size: 12px; color: var(--muted-foreground); text-align: center; margin: 10px 0 16px; }
.dropping .composer-box { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 30%, transparent); }
/* ---------- voice dictation ---------- */
.composer-box .iconbtn.micbtn.rec { background: color-mix(in oklch, var(--destructive) 14%, transparent); color: var(--destructive); }
.composer-box .iconbtn.micbtn.busy { color: var(--primary); }
.vstrip { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 7px 12px; min-height: 36px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; color: var(--muted-foreground); }
.vstrip .vdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--destructive); animation: vpulse 1.2s ease-in-out infinite; }
.vstrip.finishing .vdot, .vstrip.starting .vdot { background: var(--primary); }
.vstrip .vbars { display: inline-flex; align-items: center; gap: 2px; height: 18px; flex: none; }
.vstrip .vbars i { width: 3px; height: 3px; border-radius: 2px; background: var(--foreground); opacity: 0.7; transition: height 70ms linear; }
.vstrip .vlabel { color: var(--foreground); font-weight: 500; flex: none; }
.vstrip .vtext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
.vstrip .vkey { flex: none; font-size: 12px; }
@keyframes vpulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .vstrip .vdot { animation: none; } .vstrip .vbars i { transition: none; } }
@media (max-width: 640px) { .vstrip .vkey { display: none; } }
.filelist { margin: 0; padding: 0; list-style: none; }
.filelist li { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 2px 0; overflow-wrap: anywhere; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: oklch(0% 0 0 / 80%); display: grid; place-items: center; cursor: zoom-out; }
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }

/* ---------- calmer layout, catch-up, handoff, files ---------- */
.more-toggle { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; margin-top: 4px; font-size: 12px; color: var(--faint); }
.more-toggle:hover { color: var(--foreground); }
.more-toggle svg { width: 13px; height: 13px; transition: transform 0.12s; }
.more-toggle.open svg { transform: rotate(90deg); }
.field .filterbtn { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; }
.field .filterbtn.on { color: var(--primary); }
.field .filterbtn svg { position: static; }
.field input { padding-right: 36px; }
.pair[hidden] { display: none; }
.showall { all: unset; cursor: pointer; display: block; padding: 10px 18px; font-size: 13px; color: var(--primary); font-weight: 500; border-top: 1px solid var(--border); }
.showall:hover { background: var(--hover); }
.allclear { padding: 36px 18px; text-align: center; }
.allclear b { display: block; font-size: 17px; margin-bottom: 4px; }
.headsup { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; }
.headsup .line { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted-foreground); }
.headsup .line svg { color: var(--warning); }
details.fold { margin-bottom: 16px; }
details.fold > summary { cursor: pointer; list-style: none; padding: 14px 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary svg { color: var(--muted-foreground); transition: transform 0.12s; }
details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold[open] > summary { border-bottom: 1px solid var(--border); }
details.fold > summary .count { font-weight: 400; color: var(--muted-foreground); }
.catchup { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin: 6px 0 14px; font-size: 14px; box-shadow: var(--shadow); }
.catchup .row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 3px 0; }
.catchup .k { color: var(--muted-foreground); font-size: 13px; }
.catchup .q { color: var(--primary); font-weight: 500; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.nudge { all: unset; cursor: pointer; height: 28px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; }
[data-theme="dark"] .nudge { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
.nudge:hover { border-color: var(--primary); color: var(--primary); }
.meterbtn { all: unset; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
.meterbtn:hover { background: var(--hover); }
.modal-bg { position: fixed; inset: 0; z-index: 25; background: oklch(0% 0 0 / 45%); display: grid; place-items: center; padding: 16px; }
.modal { width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column; background: var(--background); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px oklch(0% 0 0 / 30%); }
.modal.wide { width: min(1100px, 100%); }
.modal-head { padding: 18px 20px 6px; }
.modal-head h2 { margin: 0 0 4px; font-size: 18px; }
.modal-head p { margin: 0; color: var(--muted-foreground); font-size: 14px; overflow-wrap: anywhere; }
.modal-head .meter { margin-top: 10px; }
.modal textarea { margin: 12px 20px 0; height: 300px; resize: vertical; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.5; outline: none; }
.modal textarea:focus { border-color: var(--primary); }
.modal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 20px 18px; }
.modal-foot .spacer { flex: 1; }
.viewer { margin: 12px 20px 0; min-height: 120px; display: grid; place-items: center; background: oklch(0% 0 0 / 85%); border-radius: 10px; overflow: hidden; }
.viewer video, .viewer img { max-width: 100%; max-height: 68vh; display: block; }
.viewer audio { width: 90%; margin: 30px 0; }
.viewer iframe { width: 100%; height: 68vh; border: 0; background: white; }
.viewer.text { background: var(--card); place-items: stretch; }
.viewer pre { margin: 0; padding: 14px; max-height: 68vh; overflow: auto; font-size: 12px; }
.flink { color: var(--primary); text-decoration: none; cursor: pointer; border-bottom: 1px dashed color-mix(in oklch, var(--primary) 50%, transparent); }
.flink:hover { border-bottom-style: solid; }
code .flink { border-bottom: none; }
.insight-tips { display: flex; flex-direction: column; }
.insight-tips div { padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 14px; }
.insight-tips div:last-child { border-bottom: none; }
.barlist { padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
.barlist .r { display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13px; }
.barlist .b { height: 8px; border-radius: 99px; background: color-mix(in oklch, var(--foreground) 8%, transparent); overflow: hidden; }
.barlist .b i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.barlist .n { text-align: right; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* ---------- command menu ---------- */
.composer { position: sticky; }
.palette { position: absolute; left: 0; right: 0; bottom: calc(100% - 6px); max-height: 360px; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px oklch(0% 0 0 / 25%); padding: 6px; z-index: 6; }
[data-theme="dark"] .palette { border-color: var(--input); }
.palette .ph { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); padding: 8px 10px 4px; }
.palette .pi { all: unset; cursor: pointer; box-sizing: border-box; display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; }
.palette .pi.on, .palette .pi:hover { background: var(--hover); }
.palette .pi b { font-weight: 600; white-space: nowrap; }
.palette .pi span { color: var(--muted-foreground); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette .pi.off { opacity: 0.45; }
.palette .empty { padding: 12px; color: var(--muted-foreground); font-size: 13px; }
.nudge.on { border-color: var(--primary); color: var(--primary); background: color-mix(in oklch, var(--primary) 10%, transparent); }

#usage { position: fixed; z-index: 40; width: 200px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px 12px; font-size: 12px; }
#usage .uhead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin: -2px -4px 0 0; }
#usage .iconbtn { width: 22px; height: 22px; }
#usage .iconbtn svg { width: 14px; height: 14px; }
#usage .iconbtn:hover { background: var(--hover); }
#usage .urow { margin-top: 10px; }
#usage .utop { display: flex; justify-content: space-between; color: var(--muted-foreground); }
#usage .utop b { color: var(--foreground); font-weight: 600; }
#usage .ubar { height: 6px; border-radius: 3px; background: var(--hover); margin: 5px 0 4px; overflow: hidden; }
#usage .ubar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); transition: width 0.4s ease; }
#usage .ubar.warn i { background: var(--warning); }
#usage .ubar.danger i { background: var(--destructive); }
#usage .uwhen { color: var(--faint); font-size: 11px; }
#usage .ufoot { margin-top: 10px; }
#usage .upill { display: none; }
#usage.compact { width: auto; padding: 0; border-radius: 999px; }
#usage.compact > :not(.upill) { display: none; }
#usage.compact .upill { all: unset; display: flex; gap: 6px; align-items: center; padding: 5px 12px; cursor: pointer; font-weight: 500; color: var(--muted-foreground); }
#usage .upill .warn { color: var(--warning); }
#usage .upill .danger { color: var(--destructive); }
#usage .upill .sep { color: var(--faint); }
#usage.flash { animation: uflash 1.2s ease 2; }
@keyframes uflash { 50% { box-shadow: 0 0 0 3px color-mix(in oklch, var(--warning) 45%, transparent); } }
.side-head .iconbtn.on { color: var(--foreground); }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px); background: var(--foreground); color: var(--background); padding: 9px 14px; border-radius: 8px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.18s; z-index: 10; max-width: 80vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  body { flex-direction: column; overflow: auto; }
  #side { width: auto; max-height: 44vh; }
  #main { margin: 0 8px 8px; overflow: visible; }
  .page { padding: 20px 16px 60px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hide-sm { display: none; }
  #slist { display: none; }
  #side { max-height: none; }
  .topbar-row { flex-wrap: wrap; row-gap: 4px; }
  .topbar .s-title { flex-basis: calc(100% - 44px); }
  .topbar .meterbtn, .topbar .meter { display: none; }
  .composer-box { flex-wrap: wrap; }
  .composer-box textarea { flex-basis: calc(100% - 90px); }
  .modelpick { flex: 1; }
  .srow { flex-wrap: wrap; }
  .card td, .card th { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>

</aside>

<div id="toast"></div>
<div id="usage" hidden></div>

function applyLive(live) {
  S.live = live;
  for (const s of S.sessions) s.live = null;
  S.sessions = S.sessions.filter((s) => !s.stub);
  for (const l of live) {
    let s = S.byId.get(l.id);
    if (!s || s.stub) {
      s = { id: l.id, src: 'claude', stub: true, title: 'New session', autoTitle: 'New session', first: '', last: '', cwd: l.cwd, branch: '', created: l.started, updated: l.started, turns: 0, prs: [], tag: 'Untagged', pinned: false, archived: false, note: '', resume: '', hay: 'new session' };
      S.byId.set(l.id, s);
      S.sessions.push(s);
    }
    s.live = l;
    if (l.ctx) { s.ctx = l.ctx; s.ctxLimit = l.ctxLimit; }
  }
}

async function loadHub() {
  S.hub = await api('/api/hub');
}

async function hubDo(body) {
  const r = await api('/api/hub', body);
  if (!r.ok) toast(r.error || 'That did not work.');
  await loadHub();
  renderSide();
  if (S.page === 'session') renderPanel(); else if (!typingInView() || !S.editing) renderPage();
  return r;
}

async function loadAll() {
  const [d] = await Promise.all([api('/api/sessions'), loadHub(), loadSkills().catch(() => {})]);
  S.sessions = d.sessions;
  S.tags = d.tags;
  S.latest = d.models || {};
  S.defaultModel = d.defaultModel || '';
  S.defaultEffort = d.defaultEffort || '';
  if ('usage' in d) setUsageData(d.usage);
  S.byId = new Map(d.sessions.map((s) => [s.id, s]));
  S.lastFull = Date.now();
  applyLive(d.live);
  S.liveSig = JSON.stringify(d.live);
  renderAll();
}

async function pollLive() {
  if (document.hidden) return;
  try {
    const d = await api('/api/live');
    if ('usage' in d) setUsageData(d.usage);
    const sig = JSON.stringify(d.live);
    if (sig === S.liveSig) return;
    S.liveSig = sig;
    const unknown = d.live.some((l) => { const s = S.byId.get(l.id); return !s || s.stub; });
    if (unknown && Date.now() - S.lastFull > 20000) return loadAll();
    applyLive(d.live);
    renderSide();
    if (S.page === 'session') renderLiveBits();
    else if ((S.page === 'today' || S.page === 'open') && !typingInView() && !S.editing) renderPage();
  } catch (e) {}
}

const dayStart = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const openReminders = () => S.hub.reminders.filter((r) => !r.done).sort((a, b) => a.due - b.due);
const dayAfter = (ms, n = 1) => { const d = new Date(dayStart(ms)); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); };
const dueReminders = () => openReminders().filter((r) => r.due < dayAfter(Date.now()));
function dueLabel(r) {
  const today = dayStart(Date.now());
  const day = dayStart(r.due);
  const diff = Math.round((day - today) / DAY);
  if (r.done) return 'Done';
  if (diff < 0) return `<span class="badge danger">${-diff === 1 ? 'Yesterday' : -diff + ' days late'}</span>`;
  if (r.due <= Date.now()) return `<span class="badge danger">${esc(fmtDue(r.due))}</span>`;
  if (diff === 0) return `<span class="badge primary">${esc(fmtDue(r.due))}</span>`;
  return `<span class="badge">${esc(fmtDue(r.due))}</span>`;
}
const timeInputValue = (ms) => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtDue = (ms) => { const d = new Date(ms); const today = dayStart(Date.now()); const day = dayStart(ms); const t = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: d.getMinutes() ? '2-digit' : undefined }); if (day === today) return 'Today ' + t; if (day === dayAfter(today)) return 'Tomorrow ' + t; return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + t; };

// Reads "fri 3pm call the bank", "tomorrow review the deck", "in 2h send notes", "nov 26 renew insurance", "tonight ...".
const WD = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MO = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function parseWhen(raw) {
  let t = ' ' + raw + ' ';
  const now = new Date();
  let day = null, hour = null, min = 0, abs = null;
  const take = (re, fn) => { const m = t.match(re); if (m) { fn(m); t = t.replace(m[0], ' '); return true; } return false; };
  take(/\sin\s+(\d{1,3})\s*(m|min|mins|minutes|h|hr|hrs|hours?|d|days?)\b/i, (m) => { const n = +m[1]; const u = m[2][0].toLowerCase(); abs = Date.now() + n * (u === 'm' ? 60000 : u === 'h' ? 3600000 : DAY); });
  if (abs) return { due: abs, text: t.trim().replace(/\s+/g, ' ') };
  take(/\s(today)\b/i, () => { day = new Date(now); });
  take(/\s(tomorrow|tmrw|tmr)\b/i, () => { day = new Date(dayAfter(Date.now())); });
  take(/\s(tonight)\b/i, () => { day = new Date(now); hour = 19; });
  take(/\s(this\s+)?(morning)\b/i, () => { day = day || new Date(now); hour = 9; });
  take(/\s(next\s+week)\b/i, () => { day = new Date(now.getTime() + 7 * DAY); });
  if (!day) take(/\s(?:on\s+|next\s+)?(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?)\b/i, (m) => { const w = WD.indexOf(m[1].slice(0, 3).toLowerCase()); const add = ((w - now.getDay() + 7) % 7) || 7; day = new Date(now.getTime() + add * DAY); });
  take(/\s(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/i, (m) => { const mo = MO.indexOf(m[1].slice(0, 3).toLowerCase()); let d = new Date(now.getFullYear(), mo, +m[2]); if (d.getTime() < dayStart(Date.now())) d = new Date(now.getFullYear() + 1, mo, +m[2]); day = d; });
  take(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i, (m) => { hour = (+m[1] % 12) + (m[3].toLowerCase() === 'pm' ? 12 : 0); min = +(m[2] || 0); });
  if (hour === null) take(/\sat\s+(\d{1,2}):(\d{2})\b/, (m) => { hour = +m[1]; min = +m[2]; });
  if (day === null && hour === null) return null;
  const d = day ? new Date(day) : new Date(now);
  d.setHours(hour === null ? 9 : hour, hour === null ? 0 : min, 0, 0);

}
function snoozeTo(kind) {

  d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d.getTime();
}

const dueFromInput = (v, time) => { const [y, m, d] = v.split('-').map(Number); const [hh, mm] = (time || '09:00').split(':').map(Number); return new Date(y, m - 1, d, hh || 0, mm || 0, 0).getTime(); };

// A tool call with no answer yet, on an open tab that has gone quiet, is almost always
// a permission prompt waiting for you.
function pendingOf(s) { return (s.live && s.live.pendingTool) || null; }
function needsApproval(s) {
  const pt = pendingOf(s);

  // Claude Code told us directly: a permission prompt, with nothing written to the chat since.
  // Only Claude Code's own permission-prompt signal counts, and only until anything new lands in the chat.
  return !!(ev && ev.type === 'permission' && (s.live.mtime || 0) <= ev.ts + 1500 && (s.live.since || 0) <= ev.ts + 2000 && Date.now() - ev.ts < 6 * 3600000);
}
function nowDoing(s) {
  const t = (s.live && s.live.lastTool) || s.lastTool;

  return esc(t.n) + (t.d ? ': ' + esc(t.d) : '');
}

      nav('skills', 'sparkles', 'Skills', '') : '');
  document.title = (due + waiting ? `(${due + waiting}) ` : '') + 'Hub';

  const rows = S.sessions.filter(matches);
  let h = '';
  if (S.q.trim()) {
    const hits = rows.filter((s) => !s.archived);
    h += `<div class="glabel">${hits.length} ${hits.length === 1 ? 'result' : 'results'}</div>`;
    h += hits.slice(0, 120).map(sideRow).join('') || '<div class="side-empty">Nothing matches. Try fewer words.</div>';
  } else {
    // One list, newest activity first, so a chat never jumps to another section when its tab closes.
    const pinned = rows.filter((s) => s.pinned && !s.archived).sort(recentSort);
    const recent = rows.filter((s) => !s.pinned && !s.archived).sort(recentSort).slice(0, 40);
    if (pinned.length) h += '<div class="glabel">Pinned</div>' + pinned.map(sideRow).join('');
    if (recent.length) h += '<div class="glabel">Recent</div>' + recent.map(sideRow).join('') + `<button class="navrow" data-page="history"><span class="muted">All chats</span></button>`;
    if (!h) h = '<div class="side-empty">No sessions for this filter.</div>';
  }
  const list = $('#slist');
  const top = list.scrollTop;
  list.innerHTML = h;
  list.scrollTop = top;
}

// ---------- home: open now ----------

function closeBtn(s) { return s.live ? `<button class="iconbtn" data-act="closechat" data-sid="${s.id}" title="Close this chat's tab (it stays in History)">${icon('x')}</button>` : ''; }
function homeRow(s, showClient) {
  return `<div class="srow" data-id="${s.id}">
    ${dot(s)}
    <div class="srow-main"><div class="srow-title truncate">${esc(s.title)}</div><div class="srow-sub truncate">${nowDoing(s) || esc(plain(s.last || s.first) || 'Nothing typed yet')}</div></div>
    ${showClient ? '<span class="hide-sm">' + chip(s.tag) + '</span>' : ''}
    <span class="hide-sm">${meter(s)}</span>
    ${statusBadge(s)}
    ${goBtn(s)}
    ${closeBtn(s)}
  </div>`;
}

function renderHome() {
  const all = S.sessions.filter((s) => s.live);
  const live = all.filter(matches);
  const busy = live.filter((s) => s.live.status === 'busy').length;
  const stale = live.filter(isStale).length;
  let h = `<div class="page-head"><div><h1>Chats</h1><p>${live.length} open in Terminal: ${busy} working, ${live.length - busy} idle${stale ? `, ${stale} untouched for 2+ days` : ''}.</p></div></div>
    ${chatTabs('open')}
    <div class="toolbar"><span class="muted" style="font-size:13px">Group by</span><button class="btn ${S.group === 'client' ? 'outline' : 'ghost'} sm" data-group="client">Tag</button><button class="btn ${S.group === 'status' ? 'outline' : 'ghost'} sm" data-group="status">Activity</button></div>`;
  const group = (title, color, items, showClient) => {
    if (!items.length) return;
    h += `<section class="card group"><div class="card-head">${color ? `<span class="sq" style="--c:${color}"></span>` : ''}<h2>${esc(title)}</h2><span class="count">${items.length}</span></div>${items.map((s) => homeRow(s, showClient)).join('')}</section>`;
  };
  if (!all.length) h += '<div class="card empty">No Claude Code sessions are open in a terminal right now. Pick a past one from History, or start a new session.</div>';
  else if (!live.length) h += '<div class="card empty">No open tabs match this filter.</div>';
  else if (S.group === 'client') {
    for (const n of [...S.tags.map((t) => t.name), 'Untagged']) group(tagName(n), tagColor(n), live.filter((s) => s.tag === n).sort(liveSort), false);
  } else {
    const age = (s) => Date.now() - s.live.since;
    const idle = live.filter((s) => s.live.status !== 'busy').sort(liveSort);
    group('Working now', null, live.filter((s) => s.live.status === 'busy'), true);
    group('Used today', null, idle.filter((s) => age(s) < DAY), true);
    group('Idle since yesterday', null, idle.filter((s) => age(s) >= DAY && age(s) < 2 * DAY), true);
    group('Idle 2+ days', null, idle.filter((s) => age(s) >= 2 * DAY), true);
  }
  $('#view').className = 'page';
  $('#view').innerHTML = h;
}

// ---------- today ----------

function sessionRow(s) {
  const action = s.live && !s.live.bg ? goBtn(s) : '<button class="btn outline sm">Open</button>';
  return `<div class="srow" data-id="${s.id}">
    ${dot(s)}
    <div class="srow-main"><div class="srow-title truncate">${esc(s.title)}</div><div class="srow-sub truncate">${nowDoing(s) || esc(plain(s.last || s.first))}</div></div>
    <span class="hide-sm">${chip(s.tag)}</span>
    ${s.live ? statusBadge(s) : `<span class="badge">${ago(s.updated)} ago</span>`}
    ${action}
  </div>`;
}

const chatTabs = (on) => `<div class="tabs"><button class="tab${on === 'open' ? ' on' : ''}" data-page="open">Open now</button><button class="tab${on === 'history' ? ' on' : ''}" data-page="history">All chats</button></div>`;

// Today shows only what needs you, three at a time.
function renderToday() {
  const approve = S.sessions.filter(needsApproval);
  const waiting = S.sessions.filter(unread).sort((a, b) => b.answered - a.answered);
  const due = dueReminders();
  const working = S.sessions.filter((s) => s.live && s.live.status === 'busy' && !needsApproval(s));
  const full = S.sessions.filter((s) => s.live && ctxPct(s) >= 80);
  const stale = S.sessions.filter((s) => isStale(s));
  const sug = S.hub.suggestions || [];
  const section = (key, title, items, rowFn, hint) => {
    if (!items.length) return '';
    const open = S.expand[key];
    const shown = open ? items : items.slice(0, 3);
    return `<section class="card group"><div class="card-head"><h2>${title}</h2><span class="count">${items.length}</span>${hint || ''}</div>${shown.map(rowFn).join('')}${items.length > 3 ? `<button class="showall" data-expand="${key}">${open ? 'Show less' : 'Show all ' + items.length}</button>` : ''}</section>`;
  };
  const approveRow = (s) => { const pt = pendingOf(s) || {}; const msg = (s.live.ev && s.live.ev.message) || (pt.n ? 'Wants to run ' + pt.n + (pt.d ? ': ' + pt.d : '') : 'Waiting for approval'); return `<div class="srow" data-id="${s.id}">${dot(s)}<div class="srow-main"><div class="srow-title truncate">${esc(s.title)}</div><div class="srow-sub truncate">${esc(msg)}</div></div><button class="btn primary sm" data-act="focus" data-pid="${s.live.pid}">Go to tab</button></div>`; };
  const nothing = !approve.length && !waiting.length && !due.length;
  let h = `<div class="page-head"><div><h1>Today</h1><p>${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}</p></div><span style="margin-left:auto"></span><button class="btn outline sm" data-act="toggleform">${icon('plus')}Reminder</button></div>`;
  if (S.expand.form) h += `<section class="card group">${reminderForm('', '')}</section>`;
  if (nothing) h += `<div class="card allclear"><b>Nothing needs you right now.</b><span class="muted">${working.length ? working.length + ' working in the background. ' : ''}Pick a chat on the left, or start a new one.</span></div>`;
  h += section('approve', 'Needs your approval', approve, approveRow, '<span class="hint">Stuck on a permission prompt</span>');
  h += section('waiting', 'Claude replied', waiting, sessionRow, '<button class="btn ghost sm hint" data-act="seenall">Mark all read</button>');
  h += section('due', 'Reminders due', due, reminderRow);
  const heads = [];
  if (full.length) heads.push(`<div class="line">${icon('alert')}<span>${full.length} open ${full.length === 1 ? 'chat is' : 'chats are'} nearly out of room.</span><button class="linkbtn" data-page="context">Hand them off</button></div>`);
  const badJobs = (S.hub.jobs || []).filter((j) => j.failed);
  if (badJobs.length) heads.push(`<div class="line">${icon('alert')}<span>Scheduled job failing: ${badJobs.map((j) => esc(j.name)).join(', ')}.</span><button class="linkbtn" data-act="showjobs">See why</button></div>`);
  if (stale.length >= 3) heads.push(`<div class="line">${icon('alert')}<span>${stale.length} tabs untouched for 2+ days.</span><button class="linkbtn" data-act="closetabs">Close Terminal windows</button></div>`);
  if (heads.length) h += `<div class="headsup">${heads.join('')}</div>`;
  if (working.length && !nothing) h += section('working', 'Working now', working, sessionRow);
  const hiddenSug = S.hub.hiddenSuggestions || [];
  if (sug.length || hiddenSug.length) h += `<details class="card fold"${S.expand.sug ? ' open' : ''} data-fold="sug"><summary>${icon('chevron')}Found in your chats <span class="count">${sug.length}</span><span class="muted" style="font-weight:400;font-size:13px;margin-left:auto">Dates and schedules. Delete the useless ones and similar ones stop showing.</span></summary>${sug.map((x) => sugRow(x)).join('')}${hiddenSug.length ? `<button class="showall" data-expand="hiddensug">${S.expand.hiddensug ? 'Hide' : 'Show'} ${hiddenSug.length} hidden</button>${S.expand.hiddensug ? hiddenSug.map((x) => sugRow(x, true)).join('') : ''}` : ''}</details>`;
  const soon = openReminders().filter((r) => r.due >= dayAfter(Date.now()));
  if (soon.length) h += `<details class="card fold"${S.expand.soon ? ' open' : ''} data-fold="soon"><summary>${icon('chevron')}Coming up <span class="count">${soon.length}</span></summary>${soon.map(reminderRow).join('')}</details>`;
  $('#view').className = 'page';
  $('#view').innerHTML = h;
}

    <section class="card group"><div class="card-head"><h2>Where your messages went</h2></div>${bars(d.clients, tagName)}</section>

// ---------- handoff ----------

async function openHandoff(s, auto) {
  if (!s || s.src !== 'claude' || s.stub) return;
  if (auto) { try { localStorage.setItem('sd-ho-' + s.id, '1'); } catch (e) {} }
  const d = await api('/api/handoff?id=' + s.id);
  if (!d.text) return toast('Could not build a handoff for this chat.');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-label="Hand off">
    <div class="modal-head"><h2>${auto ? 'This chat is nearly out of room' : 'Hand off to a fresh chat'}</h2>
    <p>${auto ? 'Past about 80%, Claude starts losing early details. ' : ''}This note carries the goal, recent asks, where it got to and the files changed into a new chat. Edit it if you like.</p>${meter(s, true)}</div>
    <textarea id="hotext" spellcheck="false">${esc(d.text)}</textarea>
    <div class="modal-foot">
      <button class="btn primary" data-ho="tab">${icon('terminal')}Continue in a new tab</button>
      <button class="btn outline" data-ho="background">Continue here</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-ho="copy">${icon('copy')}Copy</button>
      <button class="btn ghost" data-ho="save">Save note</button>
      <button class="btn ghost" data-ho="close">${auto ? 'Not now' : 'Close'}</button>
    </div></div>`;
  bg.onclick = async (e) => {
    const b = e.target.closest('[data-ho]');
    if (e.target === bg || (b && b.dataset.ho === 'close')) return bg.remove();
    if (!b) return;
    const text = $('#hotext').value;
    if (b.dataset.ho === 'copy') { await navigator.clipboard.writeText(text); return toast('Copied. Paste it into any new chat.'); }
    b.disabled = true;
    const r = await api('/api/handoff', { id: s.id, text, mode: b.dataset.ho });
    b.disabled = false;
    if (!r.ok) return toast(r.error || 'That did not work.');
    bg.remove();
    if (b.dataset.ho === 'save') return toast('Saved to ' + r.file);
    if (b.dataset.ho === 'tab') return toast('Opened a new Terminal tab with the handoff.');
    toast('Started a fresh chat with the handoff.');
    for (let i = 0; i < 30; i++) {
      await new Promise((res) => setTimeout(res, 1000));
      const st = await api(`/api/state?id=${r.id}&src=claude`);
      if (st.exists && st.size) { await loadAll(); if (S.byId.has(r.id)) return open(r.id); }
      if (st.error) return toast(st.error);
    }
  };
  document.body.appendChild(bg);
}

// ---------- files named in chats ----------

async function openPath(pth) {
  const info = await api('/api/fileinfo?path=' + encodeURIComponent(pth));
  if (!info.exists) return toast('That file is not there any more, or it is in a folder this page does not open.');
  if (info.dir || !info.preview) {
    const r = await api('/api/open', { path: pth, reveal: info.dir ? false : !info.preview && !['html', 'ts', 'tsx', 'js', 'jsx', 'css', 'py', 'docx', 'xlsx', 'pptx', 'key', 'pages', 'numbers', 'psd', 'fig', 'zip'].includes(info.ext) });
    return toast(r.ok ? 'Opened on your Mac.' : r.error || 'Could not open it.');
  }
  const src = '/api/file?path=' + encodeURIComponent(pth);
  const name = pth.split('/').pop();
  let body;
  if (info.kind === 'video') body = `<div class="viewer"><video src="${src}" controls autoplay playsinline></video></div>`;
  else if (info.kind === 'audio') body = `<div class="viewer"><audio src="${src}" controls autoplay></audio></div>`;
  else if (info.kind === 'image') body = `<div class="viewer"><img src="${src}" alt=""></div>`;
  else if (info.ext === 'pdf') body = `<div class="viewer"><iframe src="${src}" title="${esc(name)}"></iframe></div>`;
  else {
    const text = await fetch(src).then((r) => r.text()).catch(() => '');
    body = `<div class="viewer text"><pre>${esc(text.slice(0, 200000))}</pre></div>`;
  }
  const mb = info.size > 1e6 ? (info.size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(info.size / 1e3)) + ' KB';
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal wide" role="dialog" aria-label="${esc(name)}">
    <div class="modal-head"><h2>${esc(name)}</h2><p class="mono">${esc(pth)} · ${mb}</p></div>
    ${body}
    <div class="modal-foot">
      <button class="btn outline" data-fo="open">Open in its app</button>
      <button class="btn outline" data-fo="reveal">${icon('folder')}Show in Finder</button>
      <button class="btn ghost" data-fo="copy">${icon('copy')}Copy path</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-fo="close">Close</button>
    </div></div>`;
  bg.onclick = async (e) => {
    const b = e.target.closest('[data-fo]');
    if (e.target === bg || (b && b.dataset.fo === 'close')) { const v = bg.querySelector('video,audio'); if (v) v.pause(); return bg.remove(); }
    if (!b) return;
    if (b.dataset.fo === 'copy') { await navigator.clipboard.writeText(pth); return toast('Path copied.'); }
    const r = await api('/api/open', { path: pth, reveal: b.dataset.fo === 'reveal' });
    if (!r.ok) toast(r.error || 'Could not open it.');
  };
  document.body.appendChild(bg);
}

  if (S.rtab === 'jobs') {

// ---------- new session ----------

function renderNew() {
  const folders = ['~'];
  for (const s of S.sessions) {
    if (s.src !== 'claude' || !s.cwd) continue;
    const f = shortPath(s.cwd);
    if (f.startsWith('~/') && !folders.includes(f) && folders.length < 12) folders.push(f);
  }
  $('#view').className = 'page session';
  $('#view').innerHTML = `<div style="padding-top:28px"></div>
    <div class="page-head"><div><h1>New chat</h1><p>Starts a new Claude Code chat in the background. It joins your list and you keep chatting here, or open it in Terminal later.</p></div></div>
    <div class="card newbox" style="position:relative;overflow:visible">
      <label>Folder<select id="ncwd">${folders.map((f) => `<option>${esc(f)}</option>`).join('')}</select></label>
      <div class="palette" id="palette" hidden style="bottom:auto;top:100%"></div>
      <div class="composer-box"><textarea id="ntext" rows="3" placeholder="What do you want to work on? Type / for skills and modes"></textarea>${modelSelect(null, 'npick')}${effortSelect(null, 'nepick')}<button class="iconbtn micbtn" data-act="mic" title="${micTitle()}">${icon('mic')}</button><button class="sendbtn" data-act="newsend" title="Start"${S.starting ? ' disabled' : ''}>${icon('send')}</button></div>
      <div class="muted" id="nstatus">${S.starting ? 'Starting the session.' : 'Runs in auto mode: Claude works without stopping to ask, and blocks risky actions by itself. Enter to start, Shift+Enter for a new line.' + voiceHint()}</div>
    </div>`;
  setTimeout(() => $('#ntext') && $('#ntext').focus(), 0);
}

async function startNew() {
  const text = $('#ntext').value.trim();
  if (!text || S.starting) return;
  S.starting = true;
  const cwd = $('#ncwd').value;
  const model = $('#npick') ? $('#npick').value : '';
  const pickedEffort = $('#nepick') ? $('#nepick').value : '';
  const effort = pickedEffort && pickedEffort !== S.defaultEffort ? pickedEffort : '';
  renderNew();
  $('#ntext').value = text;
  const plan = !!S.plan.new;
  S.plan.new = false;
  const r = await api('/api/new', { text, cwd, model, effort, plan });
  if (!r.ok) { S.starting = false; renderNew(); $('#ntext').value = text; return toast(r.error || 'Could not start.'); }
  for (let i = 0; i < 40; i++) {
    await new Promise((res) => setTimeout(res, 1000));
    const st = await api(`/api/state?id=${r.id}&src=claude`);
    if (st.error) { S.starting = false; renderNew(); $('#ntext').value = text; return toast(st.error); }
    if (st.exists && st.size) {
      await loadAll();
      if (S.byId.has(r.id)) { S.starting = false; return open(r.id); }
    }
  }
  S.starting = false;
  renderNew();
  toast('It is taking a while to start. It will appear in the list when ready.');
}

// ---------- context ----------

const ctxPct = (s) => (s.ctx && s.ctxLimit ? Math.min(100, Math.round((100 * s.ctx) / s.ctxLimit)) : 0);
const kfmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n || 0));
function meter(s, wide) {
  if (!s.ctx || !s.ctxLimit) return '';
  const pct = ctxPct(s);
  const cls = pct >= 80 ? ' high' : pct >= 60 ? ' mid' : '';
  return `<span class="meter${cls}${wide ? ' wide' : ''}" title="${kfmt(s.ctx)} of ${kfmt(s.ctxLimit)} tokens of context used${s.model ? ' (' + esc(s.model) + ')' : ''}"><span class="bar"><i style="width:${pct}%"></i></span>${pct}%</span>`;
}

function renderContext() {
  const live = S.sessions.filter((s) => s.live && s.ctx).sort((a, b) => ctxPct(b) - ctxPct(a));
  const full = live.filter((s) => ctxPct(s) >= 80);
  const mid = live.filter((s) => ctxPct(s) >= 60 && ctxPct(s) < 80);
  const total = live.reduce((a, s) => a + s.ctx, 0);
  const row = (s) => `<div class="srow" data-id="${s.id}">${dot(s)}
    <div class="srow-main"><div class="srow-title truncate">${esc(s.title)}</div><div class="srow-sub truncate">${kfmt(s.ctx)} of ${kfmt(s.ctxLimit)} tokens · ${esc(modelName(s.model) || 'unknown model')}${olderModel(s) ? ' · older, ' + esc(modelName(olderModel(s))) + ' is out' : ''}</div></div>
    ${meter(s, true)}
    ${s.src === 'claude' ? `<button class="btn ${ctxPct(s) >= 80 ? 'primary' : 'outline'} sm" data-act="handoff" data-sid="${s.id}">Hand off</button>` : ''}
    ${goBtn(s, 'ghost sm')}</div>`;
  let h = `<div class="page-head"><div><h1>Context</h1><p>How full each open session's memory is. Past about 80%, Claude starts forgetting early details and gets slower and pricier. Hand off carries the important bits into a fresh chat. <code class="mono">/compact</code> squeezes the current one instead.</p></div></div>
    <div class="stats">
      <div class="card stat"><div class="label">80% or more</div><div class="num">${full.length}</div></div>
      <div class="card stat"><div class="label">60 to 80%</div><div class="num">${mid.length}</div></div>
      <div class="card stat"><div class="label">Open sessions</div><div class="num">${live.length}</div></div>
      <div class="card stat"><div class="label">Tokens held open</div><div class="num">${kfmt(total)}</div></div>
    </div>`;
  h += live.length ? `<section class="card group"><div class="card-head"><h2>Open sessions, fullest first</h2><span class="count">${live.length}</span></div>${live.map(row).join('')}</section>` : '<div class="card empty">No open sessions with context data yet.</div>';
  h += '<p class="muted" style="font-size:13px">Window size is read from the model: a model that has ever gone past 200k tokens in any session is counted as a 1M window. Set exact sizes under contextLimits in ~/.session-dashboard/config.json.</p>';
  $('#view').className = 'page';
  $('#view').innerHTML = h;
}

// ---------- skills ----------

async function loadSkills() {
  const d = await api('/api/skills');
  S.skills = d.skills;
  S.mcp = d.mcp;
  S.hasRouter = !!d.router;
  S.hasAudits = !!d.audits;
}

function auditBadge(k) {
  if (k.where === 'synced' || k.where === 'plugin' || k.where === 'codex') return '';
  if (!k.audit && !S.hasAudits) return '';
  if (!k.audit) return '<span class="badge warning">Not audited</span>';
  return `<span class="badge success" title="Audited ${esc(k.audit.date)}">${esc(k.audit.verdict)}</span>`;
}
function skillRow(k) {
  const badges = [auditBadge(k)];
  if (k.where === 'user' || k.where === 'archived') badges.push(k.triggers.length ? `<span class="badge info" title="${esc(k.triggers.join('\n'))}">Auto-loads on ${k.triggers.length} phrase${k.triggers.length === 1 ? '' : 's'}</span>` : '<span class="badge">No router phrases</span>');
  if (k.where !== 'codex') badges.push(k.count ? `<span class="badge">Used ${k.count}× · last ${ago(k.last)} ago</span>` : '<span class="badge">Never used</span>');
  if (k.linked) badges.push('<span class="badge" title="Installed with npx skills">From skills.sh</span>');
  if (k.where === 'plugin') badges.push(`<span class="badge">Plugin: ${esc(k.plugin)}</span>`);
  if (k.where === 'archived') badges.push(`<span class="badge">Archived ${esc(k.archivedOn)}</span>`);
  if (k.where === 'synced' && !k.on) badges.push('<span class="badge danger">Off</span>');
  const acts = [`<button class="btn ghost sm" data-act="kview">Read</button>`];
  if (k.where === 'user') {
    acts.push(`<button class="btn ghost sm" data-act="kreaudit">${k.audit ? 'Re-check' : 'Check'}</button>`);
    acts.push(`<button class="btn outline sm" data-act="karchive">Archive</button>`);
  }
  if (k.where === 'archived') acts.push(`<button class="btn outline sm" data-act="krestore">Restore</button>`);
  if (k.where === 'synced') acts.push(`<button class="btn outline sm" data-act="ktoggle">${k.on ? 'Turn off' : 'Turn on'}</button>`);
  return `<div class="srow plain top" data-key="${esc(k.key)}">
    <div class="srow-main"><div class="srow-title">${esc(k.name)}</div><div class="sk-desc">${esc(k.description || 'No description.')}</div><div class="sk-badges">${badges.join('')}</div></div>
    <div style="display:flex;gap:6px;flex:none">${acts.join('')}</div></div>`;
}

function renderSkills() {

  const all = S.skills;

  let h = `<div class="page-head"><div><h1>Skills</h1><p>Everything Claude can load, and whether you ever use it.</p></div></div>
    <div class="stats">
      <div class="card stat"><div class="label">Your skills</div><div class="num">${user.length}</div></div>
      ${S.hasAudits ? `<div class="card stat"><div class="label">Not audited</div><div class="num">${user.filter((k) => !k.audit).length}</div></div>` : ''}
      ${S.hasRouter ? `<div class="card stat"><div class="label">No router phrases</div><div class="num">${user.filter((k) => !k.triggers.length).length}</div></div>` : ''}
      <div class="card stat"><div class="label">Never used</div><div class="num">${user.filter((k) => !k.count).length}</div></div>
    </div>

      <div class="card-head"><h2>Add a skill</h2><span class="hint">Opens Claude in Terminal. It checks the skill first and installs it only if it looks safe.</span></div>
      <div class="form"><input type="text" id="kadd" placeholder="skills.sh or GitHub link, or describe a skill to write"><button class="btn primary" data-act="kadd">Check and add</button><button class="btn outline" data-act="kauditall">Check all my skills</button></div>
    </section>
    ${S.hasRouter ? `    <section class="card group">
      <div class="card-head"><h2>Test the router</h2><span class="hint">Type what you would say. See which skills auto-load.</span></div>
      <div class="form"><input type="text" id="krouter" placeholder="e.g. summarize this report"><button class="btn outline" data-act="krouter">Test</button></div>
      ${S.routerHits ? `<div class="router-hits">${S.routerHits.length ? S.routerHits.map((x) => `<span class="badge info">${esc(x.skill)}</span><span>matched “${esc(x.matched)}”</span>`).join('') : 'No skill would load for that.'}</div>` : ''}
    </section>` : ''}
    <div class="tabs">${tab('user', 'Yours', user.length)}${tab('synced', 'Claude.ai', by('synced').length)}${tab('plugin', 'Plugins', by('plugin').length)}${tab('codex', 'Codex', by('codex').length)}${tab('archived', 'Archived', by('archived').length)}${tab('mcp', 'MCP servers', S.mcp.length)}</div>`;
  if (S.ktab === 'mcp') {
    h += `<div class="card"><table><thead><tr><th>Server</th><th>Available in</th><th class="r">Type</th></tr></thead><tbody>${S.mcp.map((m) => `<tr style="cursor:default"><td class="t"><div class="srow-title">${esc(m.name)}</div>${m.command ? `<div class="srow-sub mono">${esc(m.command)}</div>` : ''}</td><td class="muted" style="white-space:nowrap">${esc(m.scope)}</td><td class="r">${esc(m.type)}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:13px">Names only. Keys and settings stay in ~/.claude.json and are not shown here.</p>`;
  } else {
    const terms = S.kq.toLowerCase().split(/\s+/).filter(Boolean);
    let rows = by(S.ktab).filter((k) => terms.every((t) => (k.name + ' ' + k.description).toLowerCase().includes(t)));
    rows.sort((a, b) => (b.count || 0) - (a.count || 0) || a.name.localeCompare(b.name));
    h += `<div class="toolbar"><input type="text" id="kq" placeholder="Filter skills" value="${esc(S.kq)}"></div>`;
    h += rows.length ? `<div class="card">${rows.map(skillRow).join('')}</div>` : '<div class="card empty">No skills here.</div>';
    if (S.ktab === 'synced') h += '<p class="muted" style="font-size:13px">These sync from claude.ai. Turning one off writes skillOverrides in ~/.claude/settings.json (a backup is kept next to it) and applies to new sessions.</p>';
    if (S.ktab === 'user') h += '<p class="muted" style="font-size:13px">Archive moves a skill to ~/.claude/skills-archive. Nothing is deleted and Restore puts it back.</p>';
  }
  const focusId = document.activeElement && document.activeElement.id;
  $('#view').className = 'page';
  $('#view').innerHTML = h;
  if (focusId === 'kq') { const i = $('#kq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

async function viewSkill(k) {
  const d = await api(`/api/skill?where=${encodeURIComponent(k.where)}&dir=${encodeURIComponent(k.dir)}`);
  if (!d.text) return toast('Could not read that skill.');
  const bg = document.createElement('div');
  bg.className = 'drawer-bg';
  bg.innerHTML = `<div class="drawer"><div class="drawer-head"><h2>${esc(k.name)}</h2><span class="mono muted truncate">${esc(d.path)}</span><button class="iconbtn" style="margin-left:auto" data-close>${icon('x')}</button></div><div class="drawer-body"><div class="msg a">${md(d.text)}</div></div></div>`;
  bg.onclick = (e) => { const fl = e.target.closest('.flink'); if (fl) { e.preventDefault(); return openPath(fl.dataset.path); } if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  document.body.appendChild(bg);
}

async function skillAct(act, k) {
  if (act === 'kview') return viewSkill(k);
  if (act === 'kreaudit') { const r = await api('/api/ask', { kind: 'reaudit', target: k.name }); return toast(r.ok ? 'Opened Claude in Terminal to check it.' : r.error); }
  let body;
  if (act === 'karchive') {
    if (!confirm(`Archive ${k.name}? It moves to ~/.claude/skills-archive and can be restored.`)) return;
    body = { action: 'archive', dir: k.dir };
  }
  if (act === 'krestore') body = { action: 'restore', dir: k.dir, date: k.archivedOn };
  if (act === 'ktoggle') body = { action: 'synced', dir: k.dir, on: !k.on };
  const r = await api('/api/skills', body);
  if (!r.ok) return toast(r.error || 'That did not work.');
  toast(act === 'karchive' ? 'Archived.' : act === 'krestore' ? 'Restored.' : (r.note || 'Saved.'));
  await loadSkills();
  renderSide();
  renderSkills();
}
